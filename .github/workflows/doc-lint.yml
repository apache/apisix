name: Doc Lint

on:
  push:
    paths:
      - "docs/**"
      - "**/*.md"
      - "Makefile"
      - "utils/bundle-admin-api-spec.sh"
      - ".github/workflows/doc-lint.yml"
  pull_request:
    branches: [master, "release/**"]
    paths:
      - "docs/**"
      - "**/*.md"
      - "Makefile"
      - "utils/bundle-admin-api-spec.sh"
      - ".github/workflows/doc-lint.yml"

permissions:
  contents: read

jobs:
  admin-api-openapi:
    name: Admin API OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
      - name: Bundle Admin API OpenAPI document
        run: make bundle-admin-api-spec
      - name: Check generated bundle
        run: git diff --exit-code -- docs/en/latest/admin-api.json

  markdownlint:
    name: 🍇 Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🚀 Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "12.x"
      - run: npm install -g markdownlint-cli@0.25.0
      - run: markdownlint '**/*.md'
      - name: check category
        run: |
          ./utils/check-category.py
      - name: check Chinese doc
        run: |
          sudo pip3 install zhon
          ./utils/fix-zh-doc-segment.py > \
            /tmp/check.log 2>&1 || (cat /tmp/check.log && exit 1)
          if grep "find broken newline in file: " /tmp/check.log; then
            cat /tmp/check.log
            echo "Newline can't appear in the middle of Chinese sentences."
            echo "You need to run ./utils/fix-zh-doc-segment.py to fix them."
            exit 1
          fi

  Chinse-Copywriting-lint:
    name: Chinese Copywriting
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Check Chinese copywriting
        uses: ./.github/actions/autocorrect
        with:
          args: autocorrect --lint --no-diff-bg-color ./docs/zh/latest/
