name: Admin API Contract

on:
  pull_request:
    branches: [master, 'release/**']
  push:
    branches: [master, 'release/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r utils/requirements-admin-api.txt
      - run: python -m unittest discover -s t/openapi -v
      - run: python utils/validate-admin-api.py
