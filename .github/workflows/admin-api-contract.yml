name: APISIX API Contracts

on:
  pull_request:
    branches: [master, 'release/**']
  push:
    branches: [master, 'release/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r utils/requirements-admin-api.txt
      - run: python -m unittest discover -s t/openapi -v
      - run: python utils/validate-admin-api.py
      - run: python utils/validate-control-api.py
