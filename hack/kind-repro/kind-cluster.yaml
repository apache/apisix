kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: apisix-healthcheck-repro
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30980
        hostPort: 30980
        protocol: TCP
    extraMounts:
      - hostPath: ./state/payments-api
        containerPath: /mnt/state/payments-api
      - hostPath: ./state/payproc
        containerPath: /mnt/state/payproc
