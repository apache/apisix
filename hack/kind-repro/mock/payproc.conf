server {
    listen 80;

    # Fallback backend -- always healthy, never toggled.
    location /apisix-health-v2-online-payment-write {
        return 200 'OK';
    }

    location /pay {
        default_type application/json;
        add_header X-Mock-Backend "payproc" always;
        return 201 '{"backend":"payproc"}';
    }
}
