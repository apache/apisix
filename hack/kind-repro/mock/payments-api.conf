server {
    listen 80;

    # Dedicated healthcheck endpoint -- respects the toggle sentinel.
    # Path matches the real upstream's checks.active.http_path.
    location /apisix-health-v2-online-payment-write {
        if (-f /state/unhealthy) {
            return 503;
        }
        return 200 'OK';
    }

    # Real traffic endpoint -- always succeeds, regardless of the toggle.
    # Matches confirmed prod behavior: the "unhealthy" flag only affects the
    # dedicated healthcheck path, not real payment requests.
    location /pay {
        default_type application/json;
        add_header X-Mock-Backend "payments-api" always;
        return 201 '{"backend":"payments-api"}';
    }
}
