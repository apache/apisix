servers:
  - url: "{protocol}://{host}:{port}"
    description: APISIX Admin API Server
    variables:
      protocol:
        default: http
        enum:
          - http
          - https
        description: Protocol scheme. Use `https` when `deployment.admin.https_admin` is enabled and `deployment.admin.admin_api_mtls.admin_ssl_cert` and `admin_ssl_cert_key` are configured.
      host:
        default: 127.0.0.1
        description: Admin API host address. Configure via `deployment.admin.admin_listen` in `config.yaml`.
      port:
        default: "9180"
        description: Admin API port. Default is `9180`.
