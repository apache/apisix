get:
  summary: List All Protos
  description: Retrieve all stored protobuf definitions.
  tags:
    - Protos
  parameters:
    - $ref: ../components/parameters/NameFilter.yaml
    - $ref: ../components/parameters/LabelFilter.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProtoListEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                list:
                  - value:
                      id: "1"
                      content: |-
                        syntax = "proto3";
                            package helloworld;
                            service Greeter {
                                rpc GetErrResp (HelloRequest) returns (HelloReply) {}
                            }
                            message HelloRequest {
                                string name = 1;
                                repeated string items = 2;
                            }
                            message HelloReply {
                                string message = 1;
                                repeated string items = 2;
                            }
                            message ErrorDetail {
                                int64 code = 1;
                                string message = 2;
                                string type = 3;
                            }
                      update_time: 1684752213
                      create_time: 1684752213
                    key: /apisix/protos/1
                    modifiedIndex: 292
                    createdIndex: 292
                total: 1
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: listProtos
post:
  summary: Create a Proto
  description: Upload a new protobuf definition with an auto-generated ID.
  tags:
    - Protos
  parameters:
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/ProtoUpsertPostCollection.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProtoEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/protos/00000000000000000293
                value:
                  create_time: 1684752743
                  update_time: 1684752743
                  content: |-
                    syntax = "proto3";
                        package helloworld;
                        service Greeter {
                            rpc GetErrResp (HelloRequest) returns (HelloReply) {}
                        }
                        message HelloRequest {
                            string name = 1;
                            repeated string items = 2;
                        }
                        message HelloReply {
                            string message = 1;
                            repeated string items = 2;
                        }
                        message ErrorDetail {
                            int64 code = 1;
                            string message = 2;
                            string type = 3;
                        }
                  id: "00000000000000000293"
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: createProto
