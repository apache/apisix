        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/UpstreamUpsertPatchId.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UpstreamEnvelope.yaml
          examples:
            "1":
              summary: Add Node for Upstream
              value:
                key: /apisix/upstreams/1
                value:
                  timeout:
                    send: 15
                    read: 15
                    connect: 15
                  desc: desc
                  id: "1"
                  create_time: 1684290697
                  retries: 1
                  pass_host: pass
                  update_time: 1684291001
                  type: roundrobin
                  name: upstream-for-test
                  hash_on: vars
                  nodes:
                    127.0.0.1:1981: 1
                    127.0.0.1:1980: 1
                  scheme: http
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: updateUpstream
