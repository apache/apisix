delete:
  summary: Delete an Upstream
  description: Delete an upstream by its ID. Fails if the upstream is still referenced by a route or service.
  tags:
    - Upstreams
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - name: force
      in: query
      description: Delete resource by force even if the resource is in use.
      required: false
      example: "true"
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              key:
                description: Unique key identifier for this upstream in the data store.
                type: string
              deleted:
                description: Number of deleted keys, serialized as a string for compatibility.
                type: string
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/upstreams/1
                deleted: "1"
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Missing identifier or resource is still referenced (where dependency checks apply).
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: deleteUpstream
