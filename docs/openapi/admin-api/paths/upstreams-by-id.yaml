put:
  summary: Create or Replace an Upstream
  description: Create a new upstream with a specified ID, or fully replace an existing upstream.
  tags:
    - Upstreams
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/UpstreamUpsertPutId.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UpstreamEnvelope.yaml
          examples:
            "1":
              summary: Create an Upstream by ID
              value:
                key: /apisix/upstreams/1
                value:
                  timeout:
                    send: 15
                    read: 15
                    connect: 15
                  desc: desc
                  id: "1"
                  create_time: 1684290697
                  retries: 1
                  pass_host: pass
                  update_time: 1684290697
                  type: roundrobin
                  name: upstream-for-test
                  hash_on: vars
                  nodes:
                    127.0.0.1:1980: 1
                  scheme: http
            "2":
              summary: Create HTTPS Upstream
              value:
                key: /apisix/upstreams/1
                value:
                  timeout:
                    send: 15
                    read: 15
                    connect: 15
                  desc: desc
                  id: "1"
                  create_time: 1684290697
                  retries: 1
                  pass_host: pass
                  update_time: 1684291419
                  type: roundrobin
                  name: upstream-for-test
                  hash_on: vars
                  nodes:
                    httpbin.org:443: 1
                  scheme: https
            "3":
              summary: Enable Health Check
              value:
                key: /apisix/upstreams/1
                value:
                  hash_on: vars
                  desc: desc
                  id: "1"
                  create_time: 1684292372
                  checks:
                    passive:
                      type: http
                      healthy:
                        http_statuses:
                          - 200
                          - 201
                        successes: 3
                      unhealthy:
                        timeouts: 7
                        http_statuses:
                          - 500
                        http_failures: 3
                        tcp_failures: 3
                    active:
                      host: foo.com
                      concurrency: 10
                      http_path: /status
                      https_verify_certificate: true
                      type: http
                      req_headers:
                        - "User-Agent: curl/7.29.0"
                      healthy:
                        successes: 1
                        http_statuses:
                          - 200
                          - 302
                        interval: 2
                      timeout: 5
                      unhealthy:
                        timeouts: 3
                        http_statuses:
                          - 429
                          - 404
                          - 500
                          - 501
                          - 502
                          - 503
                          - 504
                          - 505
                        interval: 1
                        http_failures: 2
                        tcp_failures: 2
                  pass_host: pass
                  update_time: 1684292372
                  type: roundrobin
                  name: upstream-for-test
                  retries: 1
                  nodes:
                    127.0.0.1:1980: 1
                    127.0.0.1:1970: 1
                  scheme: http
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: createUpstreamById
patch:
