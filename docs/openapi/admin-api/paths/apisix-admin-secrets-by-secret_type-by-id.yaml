delete:
  summary: Delete a Secret
  description: Delete a secret manager configuration.
  tags:
    - Secrets
  parameters:
    - name: secret_type
      in: path
      description: Type of secret manager (e.g., `vault`, `aws`).
      required: true
      example: vault
      schema:
        type: string
        enum:
          - vault
          - aws
          - gcp
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - name: force
      in: query
      description: Delete resource by force even if the resource is in use.
      required: false
      example: "true"
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              key:
                type: string
                description: Unique key identifier for this secret in the data store.
              deleted:
                type: string
                description: The ID of the successfully deleted secret.
          examples:
            "1":
              summary: Successful Example
              value:
                deleted: "1"
                key: /apisix/secrets/vault/1
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: deleteSecret
