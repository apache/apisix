get:
  summary: Get a Secret
  description: Retrieve a specific secret manager configuration.
  tags:
    - Secrets
  parameters:
    - name: secret_type
      in: path
      description: Type of secret manager (e.g., `vault`, `aws`).
      required: true
      example: vault
      schema:
        type: string
        enum:
          - vault
          - aws
          - gcp
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              value:
                type: object
                description: Secret values.
                properties:
                  id:
                    type: string
                    description: Unique identifier for the secret configuration, including the secret manager type and ID.
                  prefix:
                    type: string
                    description: Path prefix for the secret engine or storage location.
                  token:
                    type: string
                    description: Authentication token or credential for accessing the secret manager.
                  create_time:
                    type: integer
                    description: Creation time of the secret.
                  update_time:
                    type: integer
                    description: Update time of the secret.
                  uri:
                    type: string
                    description: Endpoint URI of the secret manager service.
              key:
                description: Unique key identifier for this secret in the data store.
                type: string
              modifiedIndex:
                description: The index number representing the most recent update to the object. It starts with the same value as `createdIndex` and increases by 1 each time the resource is modified.
                type: integer
              createdIndex:
                description: The index number representing when the object was first created. It indicates the creation order of the resource.
                type: integer
          examples:
            "1":
              summary: Successful Example
              value:
                createdIndex: 179
                key: /apisix/secrets/vault/1
                value:
                  token: 343effad
                  id: vault/1
                  uri: https://localhost/vault
                  prefix: /apisix/kv
                  update_time: 1684395392
                  create_time: 1684395392
                modifiedIndex: 179
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: getSecret
put:
  summary: Create or Replace a Secret
  description: Configure a secret manager integration with a specified ID.
  tags:
    - Secrets
  parameters:
    - name: secret_type
      in: path
      description: Type of secret manager (e.g., `vault`, `aws`).
      required: true
      example: vault
      schema:
        type: string
        enum:
          - vault
          - aws
          - gcp
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/SecretUpsertPutCollection.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            type: object
            properties:
              key:
                type: string
                description: Unique key identifier for this secret in the data store.
              value:
                type: object
                description: Secret values.
                properties:
                  id:
                    type: string
                    description: Unique identifier for the secret configuration, including the secret manager type and ID.
                  prefix:
                    type: string
                    description: Path prefix for the secret engine or storage location.
                  token:
                    type: string
                    description: Authentication token or credential for accessing the secret manager.
                  namespace:
                    type: string
                    description: Used to set the [namespace](https://developer.hashicorp.com/vault/docs/enterprise/namespaces#vault-api-and-namespaces) of HashiCorp Vault Enterprise and HCP Vault.
                  create_time:
                    type: integer
                    description: Creation time of the secret.
                  update_time:
                    type: integer
                    description: Update time of the secret.
                  uri:
                    type: string
                    description: Endpoint URI of the secret manager service.
          examples:
            "1":
              summary: Successful Example
              value:
                value:
                  prefix: /apisix/kv
                  token: 343effad
                  uri: https://localhost/vault
                  namespace: apisix
                  id: vault/1
                  update_time: 1684395392
                  create_time: 1684395392
                key: /apisix/secrets/vault/1
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: createSecretById
