get:
  summary: List Plugin Names
  description: Get a list of all available plugin names, optionally filtered by subsystem (`http` or `stream`).
  tags:
    - Plugins
  parameters:
    - $ref: ../components/parameters/Subsystem.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: array
            description: An array of plugin names.
            items:
              type: string
          examples:
            "1":
              summary: Successful Example
              value:
                - real-ip
                - ai
                - client-control
                - proxy-control
                - request-id
                - zipkin
                - ext-plugin-pre-req
                - fault-injection
                - mocking
                - serverless-pre-function
                - cors
                - ip-restriction
                - ua-restriction
                - referer-restriction
                - csrf
                - uri-blocker
                - request-validation
                - openid-connect
                - cas-auth
                - authz-casbin
                - authz-casdoor
                - wolf-rbac
                - ldap-auth
                - hmac-auth
                - basic-auth
                - jwt-auth
                - key-auth
                - consumer-restriction
                - forward-auth
                - opa
                - authz-keycloak
                - body-transformer
                - proxy-mirror
                - proxy-cache
                - proxy-rewrite
                - workflow
                - api-breaker
                - limit-conn
                - limit-count
                - limit-req
                - gzip
                - server-info
                - traffic-split
                - redirect
                - response-rewrite
                - degraphql
                - kafka-proxy
                - grpc-transcode
                - grpc-web
                - public-api
                - prometheus
                - datadog
                - elasticsearch-logger
                - echo
                - loggly
                - http-logger
                - splunk-hec-logging
                - skywalking-logger
                - google-cloud-logging
                - sls-logger
                - tcp-logger
                - kafka-logger
                - rocketmq-logger
                - syslog
                - udp-logger
                - file-logger
                - clickhouse-logger
                - tencent-cloud-cls
                - inspect
                - example-plugin
                - aws-lambda
                - azure-functions
                - openwhisk
                - openfunction
                - serverless-post-function
                - ext-plugin-post-req
                - ext-plugin-post-resp
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: listPluginNames
