parameters:
  - name: secret_type
    in: path
    required: true
    schema:
      type: string
      enum:
        - vault
        - aws
        - gcp
    description: Secret manager backend.
    example: gcp
  - $ref: ../components/parameters/IdInPath.yaml
  - name: sub_path
    in: path
    required: true
    schema:
      type: string
    description: Slash-separated nested key path within the resource document.
    example: auth_config
patch:
  tags:
    - Secrets
  operationId: patchSecretSubPath
  summary: Replace a single nested field of a secret
  description: Replaces the value at `sub_path` within the secret document with the request body. The body is any valid JSON value, not necessarily an object. The updated complete resource must pass validation.
  requestBody:
    required: true
    content:
      application/json:
        schema: {}
        example:
          client_email: apisix@example.iam.gserviceaccount.com
          private_key: example-private-key
          project_id: example-project
  responses:
    "200":
      description: Sub-field replaced.
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
  parameters:
    - $ref: ../components/parameters/Ttl.yaml
