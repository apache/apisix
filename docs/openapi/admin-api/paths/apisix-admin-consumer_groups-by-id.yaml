put:
  summary: Create or Replace a Consumer Group
  description: Create a new consumer group with a specified ID, or fully replace an existing one.
  tags:
    - Consumer Groups
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/ConsumerGroupUpsertPutId.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ConsumerGroupEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/consumer_groups/company_a
                value:
                  plugins:
                    limit-count:
                      allow_degradation: false
                      count: 2
                      group: company_a
                      time_window: 60
                      key: remote_addr
                      key_type: var
                      show_limit_quota_header: true
                      rejected_code: 503
                      policy: local
                  desc: desc
                  id: company_a
                  create_time: 1684377809
                  update_time: 1684378459
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: createConsumerGroupById
