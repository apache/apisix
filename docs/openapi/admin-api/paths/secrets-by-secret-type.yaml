parameters:
  - $ref: ../components/parameters/SecretType.yaml
get:
  tags:
    - Secrets
  operationId: listSecretsByType
  summary: List secrets of a single secret-manager type
  description: Returns secrets registered under the given manager (`vault`, `aws`, or `gcp`). For listing across all managers, use `GET /apisix/admin/secrets`.
  parameters: []
  responses:
    "200":
      description: Paginated list of secrets for this manager.
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
              list:
                type: array
                items:
                  type: object
    "401":
      $ref: ../components/responses/Unauthorized.yaml
