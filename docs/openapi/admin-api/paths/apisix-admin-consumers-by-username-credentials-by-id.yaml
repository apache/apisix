get:
  summary: Get a Credential
  description: Retrieve a specific credential for a consumer.
  tags:
    - Credentials
  parameters:
    - $ref: ../components/parameters/UsernameInPath.yaml
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CredentialEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/consumers/john/credentials/cred-john-basic-auth
                value:
                  update_time: 1725991529
                  id: cred-john-basic-auth
                  plugins:
                    basic-auth:
                      password: john-pass
                      username: john-key
                  create_time: 1725991529
                createdIndex: 42
                modifiedIndex: 42
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: getCredential
put:
  summary: Create or Replace a Credential
  description: |-
    Create a new credential for a consumer with a specified ID, or replace an existing one.

    A credential can hold at most one authentication plugin.
  tags:
    - Credentials
  parameters:
    - $ref: ../components/parameters/UsernameInPath.yaml
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/CredentialUpsert.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CredentialEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/consumers/john/credentials/cred-john-key-auth
                value:
                  create_time: 1725991703
                  id: cred-john-key-auth
                  plugins:
                    key-auth:
                      key: john-key
                  update_time: 1725991703
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: createCredentialById
delete:
  summary: Delete a Credential
  description: Delete a specific credential from a consumer.
  tags:
    - Credentials
  parameters:
    - $ref: ../components/parameters/UsernameInPath.yaml
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Force.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              key:
                description: The storage key or path identifier for the consumer credential.
                type: string
              deleted:
                description: Number of deleted keys, serialized as a string for compatibility.
                type: string
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/consumers/john/credentials/cred-john-key-auth
                deleted: "1"
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Missing identifier or resource is still referenced (where dependency checks apply).
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: deleteCredential
