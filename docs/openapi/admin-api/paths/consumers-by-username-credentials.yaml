get:
  summary: List Consumer Credentials
  description: Retrieve all credentials for a specific consumer.
  tags:
    - Credentials
  parameters:
    - $ref: ../components/parameters/UsernameInPath.yaml
    - $ref: ../components/parameters/NameFilter.yaml
    - $ref: ../components/parameters/LabelFilter.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CredentialListEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                total: 2
                list:
                  - key: /apisix/consumers/john/credentials/cred-john-basic-auth
                    value:
                      update_time: 1725991703
                      id: cred-john-basic-auth
                      plugins:
                        basic-auth:
                          password: john-pass
                          username: john-key
                      create_time: 1725991529
                    createdIndex: 42
                    modifiedIndex: 44
                  - key: /apisix/consumers/john/credentials/cred-john-key-auth
                    value:
                      update_time: 1725991703
                      id: cred-john-key-auth
                      plugins:
                        key-auth:
                          key: john-key
                      create_time: 1725991703
                    createdIndex: 43
                    modifiedIndex: 43
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: listCredentials
