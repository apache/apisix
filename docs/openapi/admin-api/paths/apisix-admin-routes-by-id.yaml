put:
  summary: Create or Replace a Route
  description: |-
    Create a new route with a specified ID, or fully replace an existing route.

    **Note:** This is a full replacement — all fields must be provided. Use `PATCH` for partial updates.
  tags:
    - Routes
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/RouteUpsertPutId.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RouteEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                value:
                  remote_addrs:
                    - 127.0.0.1
                  desc: desc
                  name: route-test
                  priority: 0
                  plugins:
                    limit-count:
                      show_limit_quota_header: true
                      policy: local
                      count: 2
                      key: remote_addr
                      rejected_code: 503
                      time_window: 60
                      key_type: var
                      allow_degradation: false
                  vars:
                    - - http_user
                      - ==
                      - ios
                  id: "1"
                  status: 1
                  uri: /ip
                  timeout:
                    connect: 3
                    read: 3
                    send: 3
                  upstream:
                    hash_on: vars
                    pass_host: pass
                    nodes:
                      httpbin.org:80: 1
                    type: roundrobin
                    scheme: http
                  methods:
                    - GET
                    - POST
                  hosts:
                    - a.com
                    - b.com
                key: /apisix/routes/1
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: createRouteById
  x-codeSamples:
    - lang: cURL
      label: cURL
      source: |-
        curl -i http://127.0.0.1:9180/apisix/admin/routes/1 \
          -H 'X-API-KEY: your-api-key' \
          -H 'Content-Type: application/json' \
          -X PUT -d '{
            "uri": "/api/v1/payments",
            "methods": ["POST"],
            "upstream": {
              "type": "roundrobin",
              "nodes": {"payments-service:8080": 1}
            }
          }'
