get:
  summary: Get Plugin JSON Schema
  description: Retrieve the JSON Schema definition for a specific plugin. This is useful for validating plugin configurations before applying them.
  tags:
    - Plugins
  parameters:
    - $ref: ../components/parameters/PluginNameInPath.yaml
    - $ref: ../components/parameters/Subsystem.yaml
    - in: query
      name: schema_type
      description: Use consumer to retrieve the consumer schema; otherwise returns the plugin schema.
      schema:
        type: string
      example: consumer
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            description: JSON Schema of the loaded plugin, selected by subsystem and schema_type. Plugin schemas and Lua validation depend on the installed plugin set.
          examples:
            keyAuthConsumer:
              summary: key-auth with schema_type=consumer (from release/3.18 plugin source)
              value:
                type: object
                properties:
                  key:
                    type: string
                encrypt_fields:
                  - key
                required:
                  - key
    "400":
      description: Unsupported subsystem or missing schema. /plugins/list returns a JSON string; other plugin endpoints return an error object.
      content:
        application/json:
          schema:
            anyOf:
              - type: string
              - $ref: ../components/schemas/ErrorResponse.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: getPluginSchema
