get:
  summary: List Consumer Credentials
  description: Retrieve all credentials for a specific consumer.
  tags:
    - Credentials
  parameters:
    - $ref: ../components/parameters/UsernameInPath.yaml
    - $ref: ../components/parameters/NameFilter.yaml
    - $ref: ../components/parameters/LabelFilter.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CredentialListEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                total: 2
                list:
                  - key: /apisix/consumers/john/credentials/cred-john-basic-auth
                    value:
                      update_time: 1725991703
                      id: cred-john-basic-auth
                      plugins:
                        basic-auth:
                          password: john-pass
                          username: john-key
                      create_time: 1725991529
                    createdIndex: 42
                    modifiedIndex: 44
                  - key: /apisix/consumers/john/credentials/cred-john-key-auth
                    value:
                      update_time: 1725991703
                      id: cred-john-key-auth
                      plugins:
                        key-auth:
                          key: john-key
                      create_time: 1725991703
                    createdIndex: 43
                    modifiedIndex: 43
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: listCredentials
put:
  summary: Create or replace a credential using a body ID
  description: The id is required in the body; the parent consumer must exist.
  tags:
    - Credentials
  parameters:
    - $ref: ../components/parameters/UsernameInPath.yaml
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    description: "`Credential` configuration body for create / replace / patch."
    required: true
    content:
      application/json:
        schema:
          allOf:
            - allOf:
                - $ref: ../components/schemas/Credential.yaml
                - not:
                    anyOf:
                      - required:
                          - create_time
                      - required:
                          - update_time
              description: Wire request body. APISIX injects timestamps and, where appropriate, the path or generated resource ID. A supplied ID must agree with the path.
            - required:
                - id
        example:
          plugins:
            key-auth:
              key: credential-secret-key-456
          id: cred1
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CredentialEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/consumers/john/credentials/cred-john-key-auth
                value:
                  create_time: 1725991703
                  id: cred-john-key-auth
                  plugins:
                    key-auth:
                      key: john-key
                  update_time: 1725991703
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: putCredentialWithBodyId
