get:
  summary: Get Stream Route by ID
  description: Get stream route by ID.
  tags:
    - Stream Routes
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      schema:
        type: string
      example: my-resource-1
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/StreamRouteEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/stream_routes/1
                value:
                  id: "1"
                  create_time: 1684392990
                  server_addr: 127.0.0.1
                  upstream:
                    hash_on: vars
                    pass_host: pass
                    nodes:
                      127.0.0.1:1995: 1
                    type: roundrobin
                    scheme: http
                  update_time: 1684392990
                  server_port: 2000
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: getStreamRoute
put:
  summary: Create Stream Route by ID
  description: Create a stream route with a specified ID.
  tags:
    - Stream Routes
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/StreamRouteUpsertPutId.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/StreamRouteEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                value:
                  id: "00000000000000000176"
                  create_time: 1684393167
                  server_addr: 127.0.0.1
                  upstream:
                    hash_on: vars
                    pass_host: pass
                    nodes:
                      127.0.0.1:1995: 1
                    type: roundrobin
                    scheme: http
                  update_time: 1684393167
                  server_port: 2000
                key: /apisix/stream_routes/00000000000000000176
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: putStreamRouteById
delete:
  summary: Delete Stream Route by ID
  description: Delete a stream route by ID.
  tags:
    - Stream Routes
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - name: force
      in: query
      description: Delete resource by force even if the resource is in use.
      required: false
      example: "true"
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              key:
                description: Unique key identifier for this stream route in the data store.
                type: string
              deleted:
                description: Number of deleted keys, serialized as a string for compatibility.
                type: string
          examples:
            "1":
              summary: Successful Example
              value:
                deleted: "1"
                key: /apisix/stream_routes/1
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Missing identifier or resource is still referenced (where dependency checks apply).
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: deleteStreamRoute
