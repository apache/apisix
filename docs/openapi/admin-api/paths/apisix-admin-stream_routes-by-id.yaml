get:
  summary: Get Stream Route by ID
  description: Get stream route by ID.
  tags:
    - Stream Routes
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      schema:
        type: string
      example: my-resource-1
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            description: Response object containing the list of stream routes.
            properties:
              items:
                type: object
                description: Stream route entry with metadata.
                properties:
                  value:
                    description: Stream route values.
                    properties:
                      desc:
                        maxLength: 256
                        type: string
                        description: Description of the stream route.
                      upstream_id:
                        description: Upstream ID.
                        anyOf:
                          - type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^[a-zA-Z0-9-_.]+$
                          - minimum: 1
                            type: integer
                      update_time:
                        type: integer
                        description: Update time of the stream route.
                      create_time:
                        type: integer
                        description: Creation time of the stream route.
                      sni:
                        type: string
                        description: SNI hostname to match. Supports wildcard hostnames. Mutually exclusive with `snis`.
                        pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
                      id:
                        description: Unique identifier for the stream route.
                        anyOf:
                          - type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^[a-zA-Z0-9-_.]+$
                          - minimum: 1
                            type: integer
                      remote_addr:
                        description: Client address filter. If the client request does not originate from `remote_addr`, the request will not be forwarded to the stream server.
                        type: string
                        anyOf:
                          - format: ipv4
                            type: string
                            title: IPv4
                          - type: string
                            title: IPv4/CIDR
                            pattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([12]?[0-9]|3[0-2])$
                          - format: ipv6
                            type: string
                            title: IPv6
                          - type: string
                            title: IPv6/CIDR
                            pattern: ^([a-fA-F0-9]{0,4}:){1,8}(:[a-fA-F0-9]{0,4}){0,8}([a-fA-F0-9]{0,4})?/[0-9]{1,3}$
                      protocol:
                        description: Protocol configuration for the stream route.
                        properties:
                          logger:
                            description: An array of logger plugin configurations.
                            items:
                              description: Logger configuration item.
                              properties:
                                conf:
                                  type: object
                                  description: Logger plugin configuration.
                                  properties: {}
                                filter:
                                  type: array
                                  description: Logger filter rules.
                                  items:
                                    type: string
                                    description: A filter rule pattern.
                                name:
                                  type: string
                                  description: Name of the logger plugin.
                              type: object
                              dependentRequired:
                                name:
                                  - conf
                            type: array
                          conf:
                            type: object
                            description: Protocol-specific configuration.
                            properties: {}
                          superior_id:
                            description: ID of a superior protocol configuration.
                            anyOf:
                              - type: string
                                minLength: 1
                                maxLength: 64
                                pattern: ^[a-zA-Z0-9-_.]+$
                              - minimum: 1
                                type: integer
                          name:
                            type: string
                            description: Name of the protocol.
                        type: object
                        required:
                          - name
                      server_addr:
                        type: string
                        description: Server IP address.
                        anyOf:
                          - format: ipv4
                            type: string
                            title: IPv4
                          - type: string
                            title: IPv4/CIDR
                            pattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([12]?[0-9]|3[0-2])$
                          - format: ipv6
                            type: string
                            title: IPv6
                          - type: string
                            title: IPv6/CIDR
                            pattern: ^([a-fA-F0-9]{0,4}:){1,8}(:[a-fA-F0-9]{0,4}){0,8}([a-fA-F0-9]{0,4})?/[0-9]{1,3}$
                      upstream:
                        description: Upstream configuration for the stream route.
                        properties:
                          desc:
                            maxLength: 256
                            type: string
                            description: Description of the upstream.
                          update_time:
                            type: integer
                            description: Update time of the stream route.
                          key:
                            type: string
                            description: The key used with `hash_on` when `type` is `chash`.<br>When `hash_on` is set to `header` or `cookie`, `key` is required.<br>When `hash_on` is set to `vars` or `vars_combinations`, `key` is required and supports [built-in variables](/apisix/reference/built-in-variables).<br>When `hash_on` is set to `consumer`, `key` is not required as the consumer name will be used as the key automatically.
                          retries:
                            minimum: 0
                            type: integer
                            description: The number of retries while passing the request to an upstream.
                          retry_timeout:
                            minimum: 0
                            type: number
                            description: Timeout to continue with retries. Setting this to 0 disables the retry timeout.
                          pass_host:
                            default: pass
                            type: string
                            enum:
                              - pass
                              - node
                              - rewrite
                            description: How to set the `Host` header when proxying to the upstream.
                            x-enumDescriptions:
                              pass: Forward the client's original `Host` header.
                              node: Use the upstream node's hostname.
                              rewrite: Use the value of `upstream_host`.
                          upstream_host:
                            type: string
                            description: Configure the host when the request is forwarded to the upstream. `pass` is used to pass the request's host to the upstream without modification. `node` sets the host to the host of the upstream node. `rewrite` sets the host to the value of `upstream_host`.
                          type:
                            type: string
                            default: roundrobin
                            enum:
                              - roundrobin
                              - chash
                              - ewma
                              - least_conn
                            description: Load balancing algorithm. Support weighted round robin, consistent hashing, exponentially weighted moving average, and least connections algorithms.
                          checks:
                            description: Health check configurations.
                            properties:
                              active:
                                description: Active health check configuration.
                                properties:
                                  port:
                                    type: integer
                                    description: By default, the port is the same as the one defined in the upstream target.
                                    minimum: 1
                                    maximum: 65535
                                  healthy:
                                    description: Active health check healthy configurations.
                                    properties:
                                      http_statuses:
                                        description: A list of HTTP response status codes which are considered healthy.
                                        uniqueItems: true
                                        items:
                                          type: integer
                                          minimum: 200
                                          maximum: 599
                                        type: array
                                        minItems: 1
                                        default:
                                          - 200
                                          - 302
                                      interval:
                                        description: Time interval of checking healthy targets in seconds.
                                        type: integer
                                        minimum: 1
                                        default: 1
                                      successes:
                                        description: The number of successful probes to define a healthy target.
                                        default: 2
                                        type: integer
                                        minimum: 1
                                        maximum: 254
                                    type: object
                                  http_path:
                                    description: The HTTP path in HTTP probe requests.
                                    default: /
                                    type: string
                                  https_verify_certificate:
                                    description: If true, verify the target's TLS certificate.
                                    default: true
                                    type: boolean
                                  unhealthy:
                                    description: Active health check unhealthy configurations.
                                    properties:
                                      interval:
                                        description: Time interval of checking unhealthy targets in seconds.
                                        type: integer
                                        minimum: 1
                                        default: 1
                                      tcp_failures:
                                        description: The number of TCP-related failures to define an unhealthy target.
                                        default: 2
                                        type: integer
                                        minimum: 1
                                        maximum: 254
                                      timeouts:
                                        description: The number of probe timeouts to define an unhealthy target.
                                        default: 3
                                        type: integer
                                        minimum: 1
                                        maximum: 254
                                      http_statuses:
                                        description: A list of HTTP response status codes which are considered unhealthy.
                                        uniqueItems: true
                                        items:
                                          type: integer
                                          minimum: 200
                                          maximum: 599
                                        type: array
                                        minItems: 1
                                        default:
                                          - 429
                                          - 404
                                          - 500
                                          - 501
                                          - 502
                                          - 503
                                          - 504
                                          - 505
                                      http_failures:
                                        description: The number of HTTP-related failures to define an unhealthy target.
                                        default: 5
                                        type: integer
                                        minimum: 1
                                        maximum: 254
                                    type: object
                                  req_headers:
                                    description: The request headers.
                                    items:
                                      type: string
                                    type: array
                                    minItems: 1
                                  timeout:
                                    description: Active check timeout in seconds.
                                    default: 1
                                    type: number
                                  type:
                                    description: Active check probing type.
                                    enum:
                                      - http
                                      - https
                                      - tcp
                                    default: http
                                    type: string
                                  host:
                                    type: string
                                    description: Host header value for health check probes sent to upstream nodes.
                                  concurrency:
                                    default: 10
                                    type: integer
                                    description: The number of targets to be checked at the same time during the active check.
                                type: object
                              passive:
                                description: Passive health check configurations.
                                properties:
                                  healthy:
                                    description: Passive health check healthy configurations.
                                    properties:
                                      http_statuses:
                                        description: A list of HTTP response status codes which are considered healthy.
                                        uniqueItems: true
                                        items:
                                          type: integer
                                          minimum: 200
                                          maximum: 599
                                        type: array
                                        minItems: 1
                                        default:
                                          - 200
                                          - 201
                                          - 202
                                          - 203
                                          - 204
                                          - 205
                                          - 206
                                          - 207
                                          - 208
                                          - 226
                                          - 300
                                          - 301
                                          - 302
                                          - 303
                                          - 304
                                          - 305
                                          - 306
                                          - 307
                                          - 308
                                      successes:
                                        description: The number of successful probes to define a healthy target.
                                        default: 5
                                        type: integer
                                        minimum: 0
                                        maximum: 254
                                    type: object
                                  unhealthy:
                                    description: Passive health check unhealthy configurations.
                                    properties:
                                      http_statuses:
                                        description: A list of HTTP response status codes which are considered unhealthy.
                                        uniqueItems: true
                                        items:
                                          type: integer
                                          minimum: 200
                                          maximum: 599
                                        type: array
                                        minItems: 1
                                        default:
                                          - 429
                                          - 500
                                          - 503
                                      http_failures:
                                        description: The number of HTTP-related failures to define an unhealthy target.
                                        default: 5
                                        type: integer
                                        minimum: 0
                                        maximum: 254
                                      tcp_failures:
                                        description: The number of TCP-related failures to define an unhealthy target.
                                        default: 2
                                        type: integer
                                        minimum: 0
                                        maximum: 254
                                      timeouts:
                                        description: The number of probe timeouts to define an unhealthy target.
                                        default: 7
                                        type: integer
                                        minimum: 0
                                        maximum: 254
                                    type: object
                                  type:
                                    description: Passive check probing type.
                                    enum:
                                      - http
                                      - https
                                      - tcp
                                    default: http
                                    type: string
                                type: object
                            type: object
                            anyOf:
                              - title: Active Check
                                required:
                                  - active
                              - title: Passive Check
                                required:
                                  - active
                                  - passive
                          hash_on:
                            default: vars
                            enum:
                              - vars
                              - header
                              - cookie
                              - consumer
                              - vars_combinations
                            description: What to hash on when `type` is `chash`.
                            type: string
                            x-enumDescriptions:
                              vars: Hash on an NGINX variable specified by `key`.
                              header: Hash on a request header specified by `key`.
                              cookie: Hash on a cookie value specified by `key`.
                              consumer: Hash on the authenticated consumer name.
                              vars_combinations: Hash on a combination of variables.
                          name:
                            description: Upstream name.
                            type: string
                            maxLength: 100
                            minLength: 1
                          scheme:
                            enum:
                              - grpc
                              - grpcs
                              - http
                              - https
                              - ws
                              - wss
                              - tcp
                              - tls
                              - udp
                              - kafka
                            default: http
                            description: Protocol for communicating with upstream nodes.
                            x-enumDescriptions:
                              grpc: Layer 7 gRPC.
                              grpcs: Layer 7 gRPC over TLS.
                              http: Layer 7 HTTP.
                              https: Layer 7 HTTP over TLS.
                              tcp: Layer 4 TCP.
                              tls: Layer 4 TCP over TLS.
                              udp: Layer 4 UDP.
                              kafka: Apache Kafka protocol.
                              ws: Frame-aware WebSocket proxying; `enable_websocket` is ignored.
                              wss: Frame-aware WebSocket proxying over TLS; uses the shared CA trust store, not `tls.ca_certs`.
                          keepalive_pool:
                            description: Upstream keepalive connection pool.
                            properties:
                              size:
                                description: The number of idle keepalive connections per worker to upstream servers.
                                default: 320
                                minimum: 1
                                type: integer
                              idle_timeout:
                                description: Time an idle keepalive connection remains open before being closed, in seconds.
                                default: 60
                                minimum: 0
                                type: number
                              requests:
                                description: The number of requests a single keepalive connection can handle before closing.
                                default: 1000
                                minimum: 1
                                type: integer
                            type: object
                          timeout:
                            description: Timeout settings for connecting to, sending, and receiving messages from the upstream, in seconds.
                            properties:
                              connect:
                                description: Connection timeout in seconds.
                                exclusiveMinimum: 0
                                type: number
                              read:
                                description: Receiving timeout in seconds.
                                exclusiveMinimum: 0
                                type: number
                              send:
                                description: Sending timeout in seconds.
                                exclusiveMinimum: 0
                                type: number
                            type: object
                          id:
                            description: Upstream ID.
                            anyOf:
                              - type: string
                                minLength: 1
                                maxLength: 64
                                pattern: ^[a-zA-Z0-9-_.]+$
                              - minimum: 1
                                type: integer
                          labels:
                            type: object
                            patternProperties:
                              .*:
                                minLength: 1
                                maxLength: 64
                                pattern: ^\S+$
                                type: string
                                description: Value of label.
                            description: Key-value pairs to specify attributes.
                            properties: {}
                          discovery_args:
                            description: Service discovery arguments.
                            properties:
                              group_name:
                                type: string
                                description: Group name.
                              namespace_id:
                                type: string
                                description: Namespace ID.
                            type: object
                          tls:
                            description: TLS configurations.
                            properties:
                              verify:
                                type: boolean
                                description: Whether to verify the upstream server certificate. If omitted for HTTPS/gRPCS, follows the NGINX verification setting, which is off unless enabled. Explicit `false` disables verification. For `wss`, explicitly set `true` to enable verification against the shared trust store.
                              client_key:
                                description: Private key.
                                minLength: 64
                                maxLength: 65536
                                type: string
                              client_cert:
                                description: Client certificate.
                                minLength: 128
                                maxLength: 65536
                                type: string
                              client_cert_id:
                                description: Client certificate ID.
                                anyOf:
                                  - type: string
                                    minLength: 1
                                    maxLength: 64
                                    pattern: ^[a-zA-Z0-9-_.]+$
                                  - minimum: 1
                                    type: integer
                              ca_certs:
                                type: array
                                minItems: 1
                                items:
                                  type: string
                                  minLength: 128
                                  maxLength: 65536
                                description: PEM-encoded CA certificates for HTTPS/gRPCS upstream verification. Replaces the NGINX trust store for this upstream. If omitted, configure and load the shared store using `proxy_ssl_verify` for HTTPS or `grpc_ssl_verify` for gRPCS. See [Configure Upstream HTTPS](/apisix/how-to-guide/traffic-management/tls-and-mtls/configure-upstream-https). Does not enable verification by itself; set `tls.verify` to `true`. Rejected for `ws` and `wss` upstreams.
                            type: object
                            dependentSchemas:
                              client_cert_id:
                                not:
                                  required:
                                    - client_cert
                                    - client_key
                              client_cert:
                                required:
                                  - client_key
                                not:
                                  required:
                                    - client_cert_id
                              client_key:
                                required:
                                  - client_cert
                                not:
                                  required:
                                    - client_cert_id
                          create_time:
                            description: Creation time of the upstream.
                            type: integer
                          warm_up_conf:
                            $ref: ../components/schemas/UpstreamWarmUp.yaml
                        additionalProperties: false
                        type: object
                        oneOf:
                          - title: Use Upstream Nodes
                            required:
                              - nodes
                            properties:
                              nodes:
                                description: The upstream endpoints.
                                anyOf:
                                  - title: Weight Mapping
                                    patternProperties:
                                      .*:
                                        type: integer
                                        minimum: 0
                                        description: "Weight of a node. For example, in `{\"ip:port\": 100}`, the value `100` represents the node's weight."
                                    type: object
                                  - title: Node Objects
                                    items:
                                      properties:
                                        weight:
                                          type: integer
                                          minimum: 0
                                          description: Weight of a node.
                                        port:
                                          type: integer
                                          minimum: 1
                                          description: Port of a node.
                                        metadata:
                                          type: object
                                          description: Metadata of a node.
                                        host:
                                          description: Upstream host.
                                          type: string
                                        priority:
                                          type: integer
                                          default: 0
                                          description: Priority of a node. A higher value corresponds to a higher priority.
                                      type: object
                                    type: array
                          - title: Use Service Registry
                            required:
                              - service_name
                              - discovery_type
                            properties:
                              service_name:
                                description: Service name in the service registry. Only valid for service discovery.
                                type: string
                                maxLength: 256
                                minLength: 1
                              discovery_type:
                                type: string
                                description: Discovery type.
                      plugins:
                        description: Key-value pairs of plugins and their configurations on the object.
                        type: object
                        properties: {}
                      server_port:
                        type: integer
                        description: Server port.
                      snis:
                        type: array
                        minItems: 1
                        uniqueItems: true
                        items:
                          type: string
                          pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
                        description: Alternative SNI hostnames to match, including wildcard hostnames. Mutually exclusive with `sni`.
                      tls_passthrough:
                        type: boolean
                        default: false
                        description: On a listener configured with both `tls` and `tls_passthrough`, `true` forwards encrypted TLS bytes to the upstream; `false` terminates TLS at APISIX. Ignored on dedicated listeners. Passthrough requires a TCP upstream, not scheme `tls`.
                    type: object
                    not:
                      required:
                        - sni
                        - snis
                  key:
                    description: Unique key identifier for this stream route in the data store.
                    type: string
                  modifiedIndex:
                    description: The index number representing the most recent update to the object. It starts with the same value as `createdIndex` and increases by 1 each time the resource is modified.
                    type: integer
                  createdIndex:
                    description: The index number representing when the object was first created. It indicates the creation order of the resource.
                    type: integer
          examples:
            "1":
              summary: Successful Example
              value:
                id: "1"
                create_time: 1684392990
                server_addr: 127.0.0.1
                upstream:
                  hash_on: vars
                  pass_host: pass
                  nodes:
                    127.0.0.1:1995: 1
                  type: roundrobin
                  scheme: http
                update_time: 1684392990
                server_port: 2000
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: getId]
put:
  summary: Create Stream Route by ID
  description: Create a stream route with a specified ID.
  tags:
    - Stream Routes
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/StreamRouteUpsertPutId.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/StreamRouteEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                value:
                  id: "00000000000000000176"
                  create_time: 1684393167
                  server_addr: 127.0.0.1
                  upstream:
                    hash_on: vars
                    pass_host: pass
                    nodes:
                      127.0.0.1:1995: 1
                    type: roundrobin
                    scheme: http
                  update_time: 1684393167
                  server_port: 2000
                key: /apisix/stream_routes/00000000000000000176
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: putId]
delete:
  summary: Delete Stream Route by ID
  description: Delete a stream route by ID.
  tags:
    - Stream Routes
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - name: force
      in: query
      description: Delete resource by force even if the resource is in use.
      required: false
      example: "true"
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              key:
                description: Unique key identifier for this stream route in the data store.
                type: string
              deleted:
                description: The ID of the successfully deleted stream route.
                type: string
          examples:
            "1":
              summary: Successful Example
              value:
                deleted: "1"
                key: /apisix/stream_routes/1
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: deleteId]
