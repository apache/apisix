parameters:
  - name: service_id
    in: path
    required: true
    description: ID of the owning service.
    schema:
      $ref: ../components/schemas/ResourceId.yaml
get:
  tags:
    - Services
  summary: List GraphQL Cost Decorations
  description: List decorations owned by this service. A service with no decorations returns 404 rather than an empty list.
  operationId: listGraphQLCostDecorations
  parameters:
    - $ref: ../components/parameters/NameFilter.yaml
    - $ref: ../components/parameters/LabelFilter.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    "200":
      description: Decoration list scoped to a service.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GraphQLCostDecorationListEnvelope.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      description: No decorations were found.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "503":
      description: The configuration store is unavailable.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
post:
  tags:
    - Services
  summary: Create a GraphQL Cost Decoration
  description: Create a decoration with an automatically generated ID. The service must exist. Ownership is taken from the URL; omit `service_id` in the body. Keep `field_path` unique within a service, and serialize concurrent writes for the service.
  operationId: createGraphQLCostDecoration
  parameters: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/GraphQLCostDecorationCreate.yaml
        example:
          field_path: Query.products
          add_value: 1
          mul_value: 1
          mul_arguments:
            - first
  responses:
    "201":
      description: Decoration created.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GraphQLCostDecorationEnvelope.yaml
    "400":
      description: Invalid configuration, conflicting service ID, or duplicate `field_path`.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      description: The owning service does not exist.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "503":
      description: The configuration store is unavailable.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
