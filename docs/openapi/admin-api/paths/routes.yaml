get:
  summary: List All Routes
  description: |-
    Retrieve all configured routes. Supports filtering by `name`, `label`, `uri`, or `filter` expression.

    Results include full route configuration and metadata (creation/update timestamps).
  tags:
    - Routes
  parameters:
    - $ref: ../components/parameters/NameFilter.yaml
    - $ref: ../components/parameters/LabelFilter.yaml
    - $ref: ../components/parameters/UriFilter.yaml
    - $ref: ../components/parameters/FilterExpr.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RouteListEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                total: 1
                list:
                  - createdIndex: 203
                    key: /apisix/routes/1
                    value:
                      remote_addrs:
                        - 127.0.0.1
                      desc: desc
                      name: route-test
                      priority: 0
                      vars:
                        - - http_user
                          - ==
                          - ios
                      update_time: 1684490006
                      create_time: 1684490006
                      id: "1"
                      plugins:
                        limit-count:
                          show_limit_quota_header: true
                          policy: local
                          count: 2
                          allow_degradation: false
                          rejected_code: 503
                          time_window: 60
                          key_type: var
                          key: remote_addr
                      status: 1
                      timeout:
                        read: 3
                        connect: 3
                        send: 3
                      uri: /ip
                      upstream:
                        hash_on: vars
                        pass_host: pass
                        nodes:
                          httpbin.org:80: 1
                        type: roundrobin
                        scheme: http
                      methods:
                        - GET
                        - POST
                      hosts:
                        - a.com
                        - b.com
                    modifiedIndex: 203
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: listRoutes
  x-codeSamples:
    - lang: cURL
      label: cURL
      source: |-
        curl -i http://127.0.0.1:9180/apisix/admin/routes \
          -H 'X-API-KEY: your-api-key'
post:
  summary: Create a Route
  description: |-
    Create a new route with an auto-generated ID.

    A route must include `uri` or `uris`, and one of: `upstream` (inline), `upstream_id`, `service_id`, `plugins`, or `script`.
  tags:
    - Routes
  parameters:
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/RouteUpsertPostCollection.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RouteEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                value:
                  desc: desc
                  name: route-name
                  update_time: 1684490245
                  priority: 0
                  id: "00000000000000000206"
                  status: 1
                  create_time: 1684490245
                  uri: /ip
                  upstream:
                    hash_on: vars
                    pass_host: pass
                    nodes:
                      httpbin.org:80: 1
                    type: roundrobin
                    scheme: http
                  methods:
                    - GET
                    - POST
                  hosts:
                    - a.com
                    - b.com
                key: /apisix/routes/00000000000000000206
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: createRoute
  x-codeSamples:
    - lang: cURL
      label: cURL
      source: |-
        curl -i http://127.0.0.1:9180/apisix/admin/routes \
          -H 'X-API-KEY: your-api-key' \
          -H 'Content-Type: application/json' \
          -X POST -d '{
            "uri": "/api/v1/users/*",
            "upstream": {
              "type": "roundrobin",
              "nodes": {"10.0.0.1:8080": 1}
            }
          }'
