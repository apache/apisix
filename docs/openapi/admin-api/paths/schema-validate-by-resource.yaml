post:
  summary: Validate Resource Configuration
  description: |-
    Validate a resource configuration against APISIX's JSON Schema without creating the resource. Useful for dry-run validation in CI/CD pipelines.

    The `{resource}` path parameter specifies the resource type (e.g., `routes`, `upstreams`, `services`, etc.).
  tags:
    - Schema Validation
  parameters:
    - $ref: ../components/parameters/ResourceKindInPath.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          description: The resource configuration to validate. The structure depends on the resource type specified in the path parameter.
          additionalProperties: true
        example:
          uri: /api/v1/*
          upstream:
            scheme: https
            type: roundrobin
            nodes:
              httpbin.org:443: 1
  responses:
    "200":
      description: Successful response.
      content: {}
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Bad Request
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: validateResourceSchema
