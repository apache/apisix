post:
  summary: Validate Resource Configuration
  description: Validate against the selected resource JSON Schema only. Does not run the resource Lua checker, plugin check_schema, reference lookups, or persist configuration. Unlike normal PUT, server-injected IDs required by a resource schema must be included in this validation payload.
  tags:
    - Schema Validation
  parameters:
    - $ref: ../components/parameters/ResourceKindInPath.yaml
  requestBody:
    content:
      application/json:
        schema:
          type: object
          description: The resource configuration to validate. The structure depends on the resource type specified in the path parameter.
          additionalProperties: true
        example:
          uri: /api/v1/*
          upstream:
            scheme: https
            type: roundrobin
            nodes:
              httpbin.org:443: 1
    required: true
  responses:
    "200":
      description: Successful response.
      content: {}
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Bad Request
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: validateResourceSchema
