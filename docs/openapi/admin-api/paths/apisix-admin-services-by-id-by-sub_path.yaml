parameters:
  - $ref: ../components/parameters/IdInPath.yaml
  - name: sub_path
    in: path
    required: true
    schema:
      type: string
    description: Slash-separated nested key path within the resource document.
    example: enable_websocket
patch:
  tags:
    - Services
  operationId: patchServicesSubPath
  summary: Replace a single nested field of a service
  description: Replaces the value at `sub_path` within the service document with the request body. The body is any valid JSON value, not necessarily an object. The updated complete resource must pass validation.
  parameters:
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema: {}
        example: true
  responses:
    "200":
      description: Sub-field replaced.
    "400":
      $ref: ../components/responses/BadRequest.yaml
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
