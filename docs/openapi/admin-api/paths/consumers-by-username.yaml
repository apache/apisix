get:
  summary: Get a Consumer
  description: Retrieve a single consumer by username.
  tags:
    - Consumers
  parameters:
    - $ref: ../components/parameters/UsernameInPath.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ConsumerEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                value:
                  plugins:
                    limit-count:
                      rejected_code: 503
                      time_window: 60
                      key: remote_addr
                      key_type: var
                      count: 2
                      allow_degradation: false
                      show_limit_quota_header: true
                      policy: local
                  username: jack
                  create_time: 1683164776
                  update_time: 1684289832
                key: /apisix/consumers/jack
                modifiedIndex: 119
                createdIndex: 17
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: getConsumer
delete:
  summary: Delete a Consumer
  description: Delete a consumer by username. This also deletes all associated credentials.
  tags:
    - Consumers
  parameters:
    - $ref: ../components/parameters/UsernameInPath.yaml
    - name: force
      in: query
      description: Delete resource by force even if the resource is in use.
      required: false
      example: "true"
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              key:
                description: Unique key identifier for this consumer in the data store.
                type: string
              deleted:
                description: The ID of the successfully deleted consumer.
                type: string
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/consumers/jack
                deleted: "1"
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: deleteConsumer
