put:
  summary: Create or Replace a Global Rule
  description: Create a new global rule with a specified ID, or fully replace an existing one.
  tags:
    - Global Rules
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/GlobalRuleUpsertPutId.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GlobalRuleEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                key: /apisix/global_rules/1
                value:
                  plugins:
                    limit-count:
                      time_window: 60
                      rejected_code: 503
                      key: remote_addr
                      key_type: var
                      count: 2
                      show_limit_quota_header: true
                      allow_degradation: false
                      policy: local
                  id: "1"
                  create_time: 1684375502
                  update_time: 1684375502
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "503":
      $ref: ../components/responses/BadRequest.yaml
      description: Storage access or write failed.
  operationId: createGlobalRuleById
