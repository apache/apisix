get:
  summary: List All Secrets
  description: Retrieve all configured secret manager integrations.
  tags:
    - Secrets
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PageSize.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              list:
                type: array
                description: An array of secret configuration objects.
                items:
                  type: object
                  properties:
                    value:
                      type: object
                      description: Secret values.
                      properties:
                        id:
                          type: string
                          description: Unique identifier for the secret configuration, including the secret manager type and ID.
                        prefix:
                          type: string
                          description: Path prefix of the secret engine that Vault should route to.
                        token:
                          type: string
                          description: Token used for APISIX to authenticate to Vault.
                        create_time:
                          type: integer
                          description: Creation time of the secret.
                        update_time:
                          type: integer
                          description: Update time of the secret.
                        uri:
                          type: string
                          description: Address of the Vault server.
                    key:
                      description: Unique key identifier for this secret in the data store.
                      type: string
                    modifiedIndex:
                      description: The index number representing the most recent update to the object. It starts with the same value as `createdIndex` and increases by 1 each time the resource is modified.
                      type: integer
                    createdIndex:
                      description: The index number representing when the object was first created. It indicates the creation order of the resource.
                      type: integer
              total:
                description: Total number of secrets matching the query criteria.
                type: integer
          examples:
            "1":
              summary: Successful Example
              value:
                total: 1
                list:
                  - createdIndex: 179
                    key: /apisix/secrets/vault/1
                    value:
                      token: 343effad
                      id: vault/1
                      uri: https://localhost/vault
                      prefix: /apisix/kv
                      update_time: 1684395392
                      create_time: 1684395392
                    modifiedIndex: 179
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: listSecrets
