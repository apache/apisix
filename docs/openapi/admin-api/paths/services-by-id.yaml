get:
  summary: Get a Service
  description: Retrieve a single service by its ID.
  tags:
    - Services
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                createdIndex: 117
                key: /apisix/services/1
                value:
                  enable_websocket: true
                  name: service-test
                  update_time: 1684490934
                  create_time: 1684287870
                  plugins:
                    limit-count:
                      show_limit_quota_header: true
                      policy: local
                      count: 2
                      allow_degradation: false
                      rejected_code: 503
                      time_window: 60
                      key_type: var
                      key: remote_addr
                  desc: hello world
                  upstream:
                    hash_on: vars
                    pass_host: pass
                    nodes:
                      127.0.0.1:1980: 1
                    type: roundrobin
                    scheme: http
                  id: "1"
                  hosts:
                    - foo.com
                modifiedIndex: 216
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: getService
put:
  summary: Create or Replace a Service
  description: Create a new service with a specified ID, or fully replace an existing service.
  tags:
    - Services
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/ServiceUpsertPutId.yaml
  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceEnvelope.yaml
          examples:
            "1":
              summary: Successful Example
              value:
                value:
                  desc: hello world
                  name: service-test
                  update_time: 1684491005
                  create_time: 1684287870
                  plugins:
                    limit-count:
                      show_limit_quota_header: true
                      policy: local
                      count: 2
                      key: remote_addr
                      rejected_code: 503
                      time_window: 60
                      key_type: var
                      allow_degradation: false
                  id: "1"
                  upstream:
                    hash_on: vars
                    pass_host: pass
                    nodes:
                      127.0.0.1:1980: 1
                    type: roundrobin
                    scheme: http
                  enable_websocket: true
                  hosts:
                    - foo.com
                key: /apisix/services/1
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
  operationId: createServiceById
patch:
  summary: Update a Service (Partial)
  description: Partially update a service's configuration.
  tags:
    - Services
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - $ref: ../components/parameters/Ttl.yaml
  requestBody:
    $ref: ../components/requestBodies/ServiceUpsertPatchId.yaml
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceEnvelope.yaml
          examples:
            "1":
              summary: Update Upstream Node To The Service
              value:
                value:
                  upstream:
                    scheme: http
                    nodes:
                      127.0.0.1:1981: 1
                      127.0.0.1:1980: 1
                    type: roundrobin
                    hash_on: vars
                    pass_host: pass
                  create_time: 1684142130
                  enable_websocket: true
                  id: "1"
                  update_time: 1684142459
                  hosts:
                    - foo.com
                  name: service-test
                  plugins: {}
                  desc: hello world
                key: /apisix/services/1
    "400":
      $ref: ../components/responses/BadRequest.yaml
      description: Invalid configuration
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: updateService
delete:
  summary: Delete a Service
  description: Delete a service by its ID.
  tags:
    - Services
  parameters:
    - name: id
      in: path
      description: Unique identifier of the resource. Can be a string (alphanumeric, `-`, `_`, `.`) or a positive integer.
      required: true
      example: my-resource-1
      schema:
        type: string
    - name: force
      in: query
      description: Delete resource by force even if the resource is in use.
      required: false
      example: "true"
      schema:
        type: string
  responses:
    "200":
      description: Successful response.
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted:
                description: The ID of the successfully deleted service.
                type: string
              key:
                description: Unique key identifier for this service.
                type: string
          examples:
            "1":
              summary: Successful Example
              value:
                deleted: "1"
                key: /apisix/services/1
    "401":
      $ref: ../components/responses/Unauthorized.yaml
    "404":
      $ref: ../components/responses/NotFound.yaml
      description: Key not found
  operationId: deleteService
