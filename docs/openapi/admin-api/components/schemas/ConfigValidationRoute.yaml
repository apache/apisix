type: object
description: |-
  Route configuration. A route matches incoming requests by URI, host, methods, and other conditions, then forwards them to an upstream.

  A route must have at least a `uri` (or `uris`) and one of: `upstream`, `upstream_id`, `service_id`, or `plugins`.

  Declarative route configuration. The optional `modifiedIndex` controls resource-level change detection with the YAML configuration provider.
properties:
  id:
    $ref: ./ResourceId.yaml
  name:
    type: string
    maxLength: 100
    minLength: 1
    description: Human-readable name for the route.
  desc:
    type: string
    maxLength: 256
    description: Description of what this route does.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  uri:
    type: string
    minLength: 1
    maxLength: 4096
    description: URI path pattern to match. Supports exact match (`/api/v1/users`) and prefix match (`/api/*`). Mutually exclusive with `uris`.
    examples:
      - /api/v1/users/*
  uris:
    type: array
    items:
      type: string
    minItems: 1
    uniqueItems: true
    description: Multiple URI patterns. Mutually exclusive with `uri`.
  host:
    type: string
    description: Single hostname to match against the request's `Host` header. Supports wildcard prefix (`*.example.com`). Mutually exclusive with `hosts`.
    examples:
      - api.example.com
  hosts:
    type: array
    items:
      type: string
    minItems: 1
    uniqueItems: true
    description: Multiple hostnames to match. Mutually exclusive with `host`.
  methods:
    type: array
    items:
      type: string
      enum:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - HEAD
        - OPTIONS
        - CONNECT
        - TRACE
        - PURGE
    uniqueItems: true
    description: HTTP methods allowed on this route. If empty or not set, all methods are allowed.
    examples:
      - - GET
        - POST
  remote_addr:
    type: string
    description: Single client IP address or CIDR range to match. Mutually exclusive with `remote_addrs`.
    examples:
      - 192.168.1.0/24
  remote_addrs:
    type: array
    items:
      type: string
    minItems: 1
    uniqueItems: true
    description: Multiple client IP addresses or CIDR ranges to match. Mutually exclusive with `remote_addr`.
  priority:
    type: integer
    default: 0
    description: Route priority. When multiple routes match the same request, the one with the highest priority wins.
  vars:
    type: array
    description: Custom matching conditions using [APISIX expressions](https://apisix.apache.org/docs/apisix/3.19/router-radixtree/#how-to-filter-route-by-nginx-built-in-variable). Each condition is an array of `[variable, operator, value]`.
    examples:
      - - - http_user_agent
          - ~*
          - curl
    items: {}
  filter_func:
    type: string
    minLength: 10
    pattern: ^function
    description: Custom Lua function for advanced request matching. Must start with `function`.
  plugins:
    $ref: ./Plugins.yaml
  plugin_config_id:
    $ref: ./ResourceId.yaml
    description: Reference to a Plugin Config resource. Cannot be used together with `script`.
  upstream:
    $ref: ./Upstream.yaml
  upstream_id:
    $ref: ./ResourceId.yaml
    description: Reference to an existing Upstream resource.
  service_id:
    $ref: ./ResourceId.yaml
    description: Reference to an existing Service resource.
  timeout:
    $ref: ./Timeout.yaml
  enable_websocket:
    type: boolean
    description: Enable WebSocket proxying on this route.
  status:
    type: integer
    enum:
      - 1
      - 0
    default: 1
    description: Route status.
    x-enumDescriptions:
      "0": Disabled.
      "1": Enabled (default).
  script:
    type: string
    minLength: 10
    maxLength: 102400
    description: Lua script for plugin orchestration. Cannot be used together with `plugins` or `plugin_config_id`.
  script_id:
    $ref: ./ResourceId.yaml
    description: Script ID (used internally by APISIX Dashboard).
  modifiedIndex:
    type: integer
    description: Optional resource version used for change detection by the YAML configuration provider.
additionalProperties: false
anyOf:
  - title: Plugin and URI required
    required:
      - plugins
      - uri
  - title: Upstream and URI required
    required:
      - upstream
      - uri
  - title: Upstream ID and URI required
    required:
      - upstream_id
      - uri
  - title: Service ID and URI required
    required:
      - service_id
      - uri
  - title: Plugin and URIs required
    required:
      - plugins
      - uris
  - title: Upstream and URIs required
    required:
      - upstream
      - uris
  - title: Upstream ID and URIs required
    required:
      - upstream_id
      - uris
  - title: Service ID and URIs required
    required:
      - service_id
      - uris
  - title: Script and URI required
    required:
      - script
      - uri
  - title: Script and URIs required
    required:
      - script
      - uris
