type: object
description: Google Cloud Secret Manager configuration.
properties:
  auth_config:
    type: object
    properties:
      client_email:
        type: string
      private_key:
        type: string
      project_id:
        type: string
      token_uri:
        type: string
        default: https://oauth2.googleapis.com/token
      scope:
        type: array
        items:
          type: string
        default:
          - https://www.googleapis.com/auth/cloud-platform
      entries_uri:
        type: string
        default: https://secretmanager.googleapis.com/v1
    required:
      - client_email
      - private_key
      - project_id
  ssl_verify:
    type: boolean
    default: true
  auth_file:
    type: string
    description: Path to a Google service-account JSON file.
oneOf:
  - required:
      - auth_config
  - required:
      - auth_file
