additionalProperties: false
not:
  anyOf:
    - required:
        - script
        - plugins
    - required:
        - script
        - plugin_config_id
type: object
anyOf:
  - required:
      - plugins
      - uri
  - required:
      - upstream
      - uri
  - required:
      - upstream_id
      - uri
  - required:
      - service_id
      - uri
  - required:
      - plugins
      - uris
  - required:
      - upstream
      - uris
  - required:
      - upstream_id
      - uris
  - required:
      - service_id
      - uris
  - required:
      - script
      - uri
  - required:
      - script
      - uris
allOf:
  - oneOf:
      - required:
          - uri
      - required:
          - uris
  - oneOf:
      - not:
          anyOf:
            - required:
                - host
            - required:
                - hosts
      - required:
          - host
      - required:
          - hosts
  - oneOf:
      - not:
          anyOf:
            - required:
                - remote_addr
            - required:
                - remote_addrs
      - required:
          - remote_addr
      - required:
          - remote_addrs
properties:
  uri:
    maxLength: 4096
    minLength: 1
    type: string
  remote_addr:
    anyOf:
      - title: IPv4
        format: ipv4
        type: string
      - title: IPv4/CIDR
        pattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([12]?[0-9]|3[0-2])$
        type: string
      - title: IPv6
        format: ipv6
        type: string
      - title: IPv6/CIDR
        pattern: ^([a-fA-F0-9]{0,4}:){1,8}(:[a-fA-F0-9]{0,4}){0,8}([a-fA-F0-9]{0,4})?/[0-9]{1,3}$
        type: string
    type: string
    description: client IP
  script:
    maxLength: 102400
    minLength: 10
    type: string
  upstream_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  create_time:
    type: integer
    readOnly: true
  vars:
    type: array
  plugins:
    type: object
  id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  status:
    default: 1
    enum:
      - 1
      - 0
    type: integer
    description: route status, 1 to enable, 0 to disable
  enable_websocket:
    type: boolean
    description: enable websocket for request
  labels:
    patternProperties:
      .*:
        maxLength: 256
        description: value of label
        minLength: 1
        pattern: ^\S+$
        type: string
    type: object
    description: key/value pairs to specify attributes
  desc:
    maxLength: 256
    type: string
  timeout:
    required:
      - connect
      - send
      - read
    properties:
      connect:
        exclusiveMinimum: 0
        type: number
      send:
        exclusiveMinimum: 0
        type: number
      read:
        exclusiveMinimum: 0
        type: number
    type: object
  service_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  upstream:
    $ref: ./UpstreamRead.yaml
  hosts:
    uniqueItems: true
    minItems: 1
    items:
      pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
      type: string
    type: array
  plugin_config_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  methods:
    uniqueItems: true
    items:
      enum:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - HEAD
        - OPTIONS
        - CONNECT
        - TRACE
        - PURGE
      type: string
      description: HTTP method
    type: array
  name:
    minLength: 1
    maxLength: 256
    type: string
  script_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  filter_func:
    pattern: ^function
    minLength: 10
    type: string
  remote_addrs:
    uniqueItems: true
    minItems: 1
    items:
      anyOf:
        - title: IPv4
          format: ipv4
          type: string
        - title: IPv4/CIDR
          pattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([12]?[0-9]|3[0-2])$
          type: string
        - title: IPv6
          format: ipv6
          type: string
        - title: IPv6/CIDR
          pattern: ^([a-fA-F0-9]{0,4}:){1,8}(:[a-fA-F0-9]{0,4}){0,8}([a-fA-F0-9]{0,4})?/[0-9]{1,3}$
          type: string
      type: string
      description: client IP
    type: array
  uris:
    uniqueItems: true
    minItems: 1
    items:
      type: string
      description: HTTP uri
    type: array
  host:
    pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
    type: string
  priority:
    default: 0
    type: integer
  update_time:
    type: integer
    readOnly: true
x-source: apisix/schema_def.lua
description: Stored Route configuration returned by the Admin API.
