type: object
description: |-
  Plugin Config — a reusable set of plugin configurations that can be referenced by multiple routes.

  Declarative plugin config configuration. The optional `modifiedIndex` controls resource-level change detection with the YAML configuration provider.
required:
  - plugins
properties:
  id:
    $ref: ./ResourceId.yaml
  name:
    type: string
    description: Human-readable name.
  desc:
    type: string
    maxLength: 256
    description: Description.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  plugins:
    $ref: ./Plugins.yaml
  modifiedIndex:
    type: integer
    description: Optional resource version used for change detection by the YAML configuration provider.
additionalProperties: false
