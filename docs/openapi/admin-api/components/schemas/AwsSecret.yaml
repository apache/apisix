type: object
description: AWS Secrets Manager configuration.
properties:
  access_key_id:
    type: string
    description: AWS access key ID or environment-variable URI.
  secret_access_key:
    type: string
    description: AWS secret access key or environment-variable URI.
  session_token:
    type: string
    description: Optional AWS session token or environment-variable URI.
  region:
    type: string
    default: us-east-1
    description: AWS region.
  endpoint_url:
    type: string
    format: uri
    description: Custom AWS Secrets Manager endpoint.
required:
  - access_key_id
  - secret_access_key
