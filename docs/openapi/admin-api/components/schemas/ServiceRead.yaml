type: object
description: Stored Service configuration returned by the Admin API.
properties:
  id:
    $ref: ./ResourceId.yaml
  name:
    type: string
    maxLength: 256
    minLength: 1
    description: Human-readable name.
  desc:
    type: string
    maxLength: 256
    description: Description of this service.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  plugins:
    $ref: ./Plugins.yaml
  upstream:
    $ref: ./UpstreamRead.yaml
  upstream_id:
    $ref: ./ResourceId.yaml
    description: Reference to an existing Upstream resource.
  script:
    type: string
    minLength: 10
    maxLength: 102400
    description: Lua script for plugin orchestration.
  enable_websocket:
    type: boolean
    description: Enable WebSocket proxying for routes using this service.
  hosts:
    type: array
    items:
      type: string
    minItems: 1
    uniqueItems: true
    description: Hostnames associated with this service.
additionalProperties: false
