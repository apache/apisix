additionalProperties: false
not:
  required:
    - sni
    - snis
properties:
  remote_addr:
    anyOf:
      - title: IPv4
        format: ipv4
        type: string
      - title: IPv4/CIDR
        pattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([12]?[0-9]|3[0-2])$
        type: string
      - title: IPv6
        format: ipv6
        type: string
      - title: IPv6/CIDR
        pattern: ^([a-fA-F0-9]{0,4}:){1,8}(:[a-fA-F0-9]{0,4}){0,8}([a-fA-F0-9]{0,4})?/[0-9]{1,3}$
        type: string
    type: string
    description: client IP
  sni:
    pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
    type: string
    description: server name indication
  upstream_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  create_time:
    type: integer
    readOnly: true
  service_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  plugins:
    type: object
  id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  server_addr:
    anyOf:
      - title: IPv4
        format: ipv4
        type: string
      - title: IPv4/CIDR
        pattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([12]?[0-9]|3[0-2])$
        type: string
      - title: IPv6
        format: ipv6
        type: string
      - title: IPv6/CIDR
        pattern: ^([a-fA-F0-9]{0,4}:){1,8}(:[a-fA-F0-9]{0,4}){0,8}([a-fA-F0-9]{0,4})?/[0-9]{1,3}$
        type: string
    type: string
    description: server IP
  server_port:
    minimum: 1
    maximum: 65535
    type: integer
    description: server port
  labels:
    patternProperties:
      .*:
        maxLength: 256
        description: value of label
        minLength: 1
        pattern: ^\S+$
        type: string
    type: object
    description: key/value pairs to specify attributes
  desc:
    maxLength: 256
    type: string
  protocol:
    required:
      - name
    properties:
      name:
        type: string
      conf:
        type: object
        description: protocol-specific configuration
      superior_id:
        anyOf:
          - pattern: ^[a-zA-Z0-9-_.]+$
            maxLength: 64
            minLength: 1
            type: string
          - minimum: 1
            type: integer
      logger:
        items:
          additionalProperties: false
          properties:
            name:
              type: string
            filter:
              type: array
              description: logger filter rules
            conf:
              type: object
              description: logger plugin configuration
          dependentRequired:
            name:
              - conf
        type: array
    type: object
  name:
    minLength: 1
    maxLength: 256
    type: string
  snis:
    description: server name indications, matched as alternatives
    uniqueItems: true
    minItems: 1
    items:
      pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
      type: string
    type: array
  tls_passthrough:
    default: false
    type: boolean
    description: forward the TLS stream to the upstream untouched instead of terminating it here; only consulted on a mixed listen, one with both tls and tls_passthrough set
  upstream:
    additionalProperties: false
    properties:
      tls:
        properties:
          ca_certs:
            items:
              maxLength: 65536
              minLength: 128
              type: string
            description: CA certificates used to verify the upstream certificate
            minItems: 1
            type: array
          client_cert_id:
            anyOf:
              - pattern: ^[a-zA-Z0-9-_.]+$
                maxLength: 64
                minLength: 1
                type: string
              - minimum: 1
                type: integer
          client_key:
            maxLength: 65536
            minLength: 64
            type: string
          client_cert:
            maxLength: 65536
            minLength: 128
            type: string
          verify:
            description: enable or disable upstream certificate verification, fall back to the nginx configuration when not set
            type: boolean
        type: object
        dependentSchemas:
          client_key:
            required:
              - client_cert
          client_cert:
            required:
              - client_key
          client_cert_id:
            not:
              required:
                - client_cert
                - client_key
      checks:
        anyOf:
          - required:
              - active
          - required:
              - active
              - passive
        properties:
          passive:
            properties:
              unhealthy:
                properties:
                  timeouts:
                    minimum: 0
                    maximum: 254
                    default: 7
                    type: integer
                  tcp_failures:
                    minimum: 0
                    maximum: 254
                    default: 2
                    type: integer
                  http_failures:
                    minimum: 0
                    maximum: 254
                    default: 5
                    type: integer
                  http_statuses:
                    type: array
                    uniqueItems: true
                    items:
                      minimum: 200
                      maximum: 599
                      type: integer
                    minItems: 1
                    default:
                      - 429
                      - 500
                      - 503
                type: object
              healthy:
                properties:
                  successes:
                    minimum: 0
                    maximum: 254
                    default: 5
                    type: integer
                  http_statuses:
                    type: array
                    uniqueItems: true
                    items:
                      minimum: 200
                      maximum: 599
                      type: integer
                    minItems: 1
                    default:
                      - 200
                      - 201
                      - 202
                      - 203
                      - 204
                      - 205
                      - 206
                      - 207
                      - 208
                      - 226
                      - 300
                      - 301
                      - 302
                      - 303
                      - 304
                      - 305
                      - 306
                      - 307
                      - 308
                type: object
              type:
                default: http
                enum:
                  - http
                  - https
                  - tcp
                type: string
            type: object
          active:
            properties:
              host:
                pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
                type: string
              concurrency:
                default: 10
                type: integer
              timeout:
                default: 1
                type: number
              type:
                default: http
                enum:
                  - http
                  - https
                  - tcp
                type: string
              unhealthy:
                properties:
                  tcp_failures:
                    minimum: 1
                    maximum: 254
                    default: 2
                    type: integer
                  http_statuses:
                    type: array
                    uniqueItems: true
                    items:
                      minimum: 200
                      maximum: 599
                      type: integer
                    minItems: 1
                    default:
                      - 429
                      - 404
                      - 500
                      - 501
                      - 502
                      - 503
                      - 504
                      - 505
                  interval:
                    minimum: 1
                    default: 1
                    type: integer
                  http_failures:
                    minimum: 1
                    maximum: 254
                    default: 5
                    type: integer
                  timeouts:
                    minimum: 1
                    maximum: 254
                    default: 3
                    type: integer
                type: object
              http_req_body:
                default: ""
                type: string
              http_method:
                default: GET
                enum:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - HEAD
                  - OPTIONS
                  - CONNECT
                  - TRACE
                  - PURGE
                type: string
              http_path:
                default: /
                type: string
              req_headers:
                items:
                  uniqueItems: true
                  type: string
                minItems: 1
                type: array
              healthy:
                properties:
                  interval:
                    minimum: 1
                    default: 1
                    type: integer
                  successes:
                    minimum: 1
                    maximum: 254
                    default: 2
                    type: integer
                  http_statuses:
                    type: array
                    uniqueItems: true
                    items:
                      minimum: 200
                      maximum: 599
                      type: integer
                    minItems: 1
                    default:
                      - 200
                      - 302
                type: object
              https_verify_certificate:
                default: true
                type: boolean
              port:
                minimum: 1
                maximum: 65535
                type: integer
            type: object
        type: object
      retries:
        minimum: 0
        type: integer
      create_time:
        type: integer
      discovery_type:
        type: string
        description: discovery type
      id:
        anyOf:
          - pattern: ^[a-zA-Z0-9-_.]+$
            maxLength: 64
            minLength: 1
            type: string
          - minimum: 1
            type: integer
      service_name:
        minLength: 1
        maxLength: 256
        type: string
      labels:
        patternProperties:
          .*:
            maxLength: 256
            description: value of label
            minLength: 1
            pattern: ^\S+$
            type: string
        type: object
        description: key/value pairs to specify attributes
      desc:
        maxLength: 256
        type: string
      timeout:
        required:
          - connect
          - send
          - read
        properties:
          connect:
            exclusiveMinimum: 0
            type: number
          send:
            exclusiveMinimum: 0
            type: number
          read:
            exclusiveMinimum: 0
            type: number
        type: object
      type:
        default: roundrobin
        type: string
        description: algorithms of load balancing
      pass_host:
        default: pass
        enum:
          - pass
          - node
          - rewrite
        type: string
        description: mod of host passing
      scheme:
        description: The scheme of the upstream. For L7 proxy, it can be one of grpc/grpcs/http/https/ws/wss. For L4 proxy, it can be one of tcp/tls/udp. For specific protocols, it can be kafka.
        enum:
          - grpc
          - grpcs
          - http
          - https
          - tcp
          - tls
          - udp
          - kafka
          - ws
          - wss
        default: http
      upstream_host:
        pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
        type: string
      discovery_args:
        properties:
          namespace_id:
            type: string
            description: namespace id
          group_name:
            type: string
            description: group name
          cluster_ids:
            description: ids of the kubernetes discovery clusters to get nodes from
            uniqueItems: true
            items:
              type: string
            minItems: 1
            type: array
        type: object
      name:
        minLength: 1
        maxLength: 256
        type: string
      warm_up_conf:
        additionalProperties: false
        required:
          - slow_start_time_seconds
          - min_weight_percent
        description: "slow start: ramp a newly observed node up to its configured weight"
        type: object
        properties:
          min_weight_percent:
            minimum: 1
            maximum: 100
            type: integer
            description: lowest effective weight, as a percentage of the original weight
          aggression:
            minimum: 0.01
            default: 1
            type: number
            description: "shape of the ramp: 1 is linear, above 1 ramps up faster at the beginning, below 1 slower"
          startup_grace_period_seconds:
            minimum: 0
            default: 0
            type: integer
            description: seconds after the data plane started during which a node observed for the first time is considered mature
          interval:
            minimum: 1
            default: 1
            type: integer
            description: seconds between two effective weight refreshes
          slow_start_time_seconds:
            minimum: 1
            type: integer
            description: seconds a new node takes to reach its full weight
      key:
        type: string
        description: the key of chash for dynamic load balancing
      hash_on:
        enum:
          - vars
          - header
          - cookie
          - consumer
          - vars_combinations
        default: vars
        type: string
      keepalive_pool:
        properties:
          requests:
            minimum: 1
            default: 1000
            type: integer
          idle_timeout:
            minimum: 0
            default: 60
            type: number
          size:
            minimum: 1
            default: 320
            type: integer
        type: object
      retry_timeout:
        minimum: 0
        type: number
      nodes:
        anyOf:
          - patternProperties:
              .*:
                minimum: 0
                type: integer
                description: weight of node
            type: object
          - items:
              required:
                - host
                - weight
              properties:
                host:
                  pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
                  type: string
                metadata:
                  type: object
                  description: metadata of node
                priority:
                  default: 0
                  type: integer
                  description: priority of node
                weight:
                  minimum: 0
                  type: integer
                  description: weight of node
                port:
                  minimum: 1
                  maximum: 65535
                  type: integer
                  description: port of node
              type: object
            type: array
      update_time:
        type: integer
    oneOf:
      - required:
          - nodes
      - required:
          - service_name
          - discovery_type
    type: object
  update_time:
    type: integer
    readOnly: true
type: object
x-source: apisix/schema_def.lua
