type: object
description: Plugin Config — a reusable set of plugin configurations that can be referenced by multiple routes.
required:
  - plugins
properties:
  id:
    $ref: ./ResourceId.yaml
  name:
    type: string
    description: Human-readable name.
  desc:
    type: string
    maxLength: 256
    description: Description.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  plugins:
    $ref: ./Plugins.yaml
additionalProperties: false
