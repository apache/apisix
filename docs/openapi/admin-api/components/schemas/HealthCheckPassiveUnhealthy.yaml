type: object
description: Thresholds for considering a target unhealthy based on real traffic responses.
properties:
  http_statuses:
    type: array
    minItems: 1
    items:
      type: integer
      minimum: 200
      maximum: 599
    uniqueItems: true
    default:
      - 429
      - 500
      - 503
    description: HTTP status codes from real traffic that indicate an unhealthy target.
  tcp_failures:
    type: integer
    minimum: 0
    maximum: 254
    default: 2
    description: Number of TCP failures from real traffic to consider a target unhealthy.
  timeouts:
    type: integer
    minimum: 0
    maximum: 254
    default: 7
    description: Number of timeouts from real traffic to consider a target unhealthy.
  http_failures:
    type: integer
    minimum: 0
    maximum: 254
    default: 5
    description: Number of HTTP failures from real traffic to consider a target unhealthy.
