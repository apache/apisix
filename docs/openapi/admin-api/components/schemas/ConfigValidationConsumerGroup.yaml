type: object
description: |-
  Consumer Group configuration. Defines shared plugin configurations for multiple consumers.

  Declarative consumer group configuration. The optional `modifiedIndex` controls resource-level change detection with the YAML configuration provider.
required:
  - plugins
properties:
  id:
    $ref: ./ResourceId.yaml
  name:
    type: string
    maxLength: 256
    minLength: 1
    description: Human-readable name.
  desc:
    type: string
    maxLength: 256
    description: Description of this group.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  plugins:
    $ref: ./Plugins.yaml
  modifiedIndex:
    type: integer
    description: Optional resource version used for change detection by the YAML configuration provider.
additionalProperties: false
