type: object
description: Gradually increases the effective weight of newly observed nodes. Only supported for HTTP upstreams using `roundrobin` and a single node priority; ignored by stream routes and rejected in inline `traffic-split` upstreams. The initial node set is already warmed. Each gateway instance tracks ramps independently. This changes traffic distribution, not the total request rate.
properties:
  slow_start_time_seconds:
    type: integer
    minimum: 1
    description: Seconds for a new node to reach its configured weight.
  min_weight_percent:
    type: integer
    minimum: 1
    maximum: 100
    description: Minimum percentage of the configured node weight. Effective positive weights are rounded down but never below 1.
  interval:
    type: integer
    minimum: 1
    default: 1
    description: Seconds between weight refreshes. Cannot exceed `slow_start_time_seconds`.
  aggression:
    type: number
    minimum: 0.01
    default: 1
    description: "Ramp shape: 1 is linear, above 1 is faster initially, and below 1 is slower initially."
  startup_grace_period_seconds:
    type: integer
    minimum: 0
    default: 0
    description: Seconds after the gateway starts during which newly observed nodes are treated as already warmed.
required:
  - slow_start_time_seconds
  - min_weight_percent
additionalProperties: false
