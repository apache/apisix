type: object
description: Partial update for upstream slow-start settings. Null removes an object field; the merged resource is validated against UpstreamWarmUp.
properties:
  slow_start_time_seconds:
    anyOf:
      - type: integer
        minimum: 1
        description: Seconds for a new node to reach its configured weight.
      - type: "null"
  min_weight_percent:
    anyOf:
      - type: integer
        minimum: 1
        maximum: 100
        description: Minimum percentage of the configured node weight. Effective positive weights are rounded down but never below 1.
      - type: "null"
  interval:
    anyOf:
      - type: integer
        minimum: 1
        default: 1
        description: Seconds between weight refreshes. Cannot exceed `slow_start_time_seconds`.
      - type: "null"
  aggression:
    anyOf:
      - type: number
        minimum: 0.01
        default: 1
        description: "Ramp shape: 1 is linear, above 1 is faster initially, and below 1 is slower initially."
      - type: "null"
  startup_grace_period_seconds:
    anyOf:
      - type: integer
        minimum: 0
        default: 0
        description: Seconds after the gateway starts during which newly observed nodes are treated as already warmed.
      - type: "null"
additionalProperties: false
