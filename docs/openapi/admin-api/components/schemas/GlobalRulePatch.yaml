type: object
description: Partial update for an existing `GlobalRule`. APISIX recursively merges object fields, replaces arrays, and removes an object field when its value is `null`. The merged resource is then validated against the complete `GlobalRule` schema.
properties:
  id:
    description: Unique identifier for the resource. Can be a string (1–64 characters, alphanumeric with `-`, `_`, `.`) or a positive integer.
    anyOf:
      - type:
          - string
          - "null"
        minLength: 1
        maxLength: 64
        pattern: ^[a-zA-Z0-9-_.]+$
        examples:
          - my-route-1
        title: String ID
      - type:
          - integer
          - "null"
        minimum: 1
        examples:
          - 1
        title: Integer ID
      - type: "null"
  create_time:
    type:
      - integer
      - "null"
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type:
      - integer
      - "null"
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  plugins:
    type:
      - object
      - "null"
    description: |-
      Plugin configurations as a JSON object. Each key is a plugin name, and the value is that plugin's configuration object.

      Example:
      ```json
      {
        "limit-count": {
          "count": 100,
          "time_window": 60
        },
        "key-auth": {}
      }
      ```

      See the [Plugin Hub](https://apisix.apache.org/plugins/) for available plugins and their schemas.
    additionalProperties:
      type:
        - object
        - "null"
    examples:
      - limit-count:
          count: 100
          time_window: 60
          rejected_code: 429
          key_type: var
          key: remote_addr
additionalProperties: false
