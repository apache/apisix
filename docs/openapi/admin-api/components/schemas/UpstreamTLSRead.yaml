properties:
  ca_certs:
    items:
      $ref: ./CertificatePem.yaml
    description: CA certificates used to verify the upstream certificate
    minItems: 1
    type: array
  client_cert_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  client_key:
    $ref: ./StoredPrivateKeyValue.yaml
    description: Stored client private-key value returned by the Admin API.
  client_cert:
    $ref: ./CertificatePem.yaml
  verify:
    description: Enable or disable upstream certificate verification. When omitted, fall back to the NGINX verification setting.
    type: boolean
type: object
dependentSchemas:
  client_key:
    required:
      - client_cert
  client_cert:
    required:
      - client_key
  client_cert_id:
    not:
      required:
        - client_cert
        - client_key
description: Stored upstream TLS configuration returned by the Admin API.
