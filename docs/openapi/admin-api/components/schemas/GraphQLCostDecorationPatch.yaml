type: object
description: Fields to merge into an existing decoration. Omitted fields retain their current values. The `id`, if supplied, must match the URL.
properties:
  id:
    $ref: ./ResourceId.yaml
  create_time:
    type: integer
  update_time:
    type: integer
  field_path:
    type: string
    pattern: ^[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)*$
    description: Position in the GraphQL schema. A type name weights fields returning that type; a type and field name weights that field; further segments restrict the selection chain. `Query` or `Mutation` alone weights the whole operation.
    examples:
      - Query.products
      - Product.reviews
  add_value:
    type: number
    minimum: 0
    description: The node's own cost.
  add_arguments:
    type: array
    items:
      type: string
      minLength: 1
    description: Arguments whose values are added to `add_value`.
  mul_value:
    type: number
    minimum: 0
    description: Multiplier applied to the cost of selected children.
  mul_arguments:
    type: array
    items:
      type: string
      minLength: 1
    description: Arguments whose values multiply `mul_value`. Under `node_quantifier`, these quantifiers carry to deeper quantified nodes.
  name:
    type: string
    maxLength: 256
    minLength: 1
  desc:
    type: string
    maxLength: 256
  labels:
    $ref: ./Labels.yaml
additionalProperties: false
