additionalProperties: false
else:
  required:
    - key
    - cert
if:
  properties:
    type:
      enum:
        - server
then:
  oneOf:
    - required:
        - sni
        - key
        - cert
    - required:
        - snis
        - key
        - cert
properties:
  snis:
    items:
      pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
      type: string
    minItems: 1
    type: array
  update_time:
    type: integer
    readOnly: true
  ssl_protocols:
    items:
      enum:
        - TLSv1.1
        - TLSv1.2
        - TLSv1.3
    maxItems: 3
    description: set ssl protocols
    uniqueItems: true
    type: array
  key:
    $ref: ./PrivateKeyOrReference.yaml
    description: PEM-encoded private key or an APISIX secret/environment reference.
  create_time:
    type: integer
    readOnly: true
  labels:
    $ref: ./Labels.yaml
  status:
    default: 1
    description: ssl status, 1 to enable, 0 to disable
    enum:
      - 1
      - 0
    type: integer
  cert:
    $ref: ./CertificateOrReference.yaml
    description: PEM-encoded certificate or an APISIX secret/environment reference.
  client:
    required:
      - ca
    properties:
      ca:
        $ref: ./CertificateOrReference.yaml
        description: PEM-encoded CA certificate or an APISIX secret/environment reference.
      skip_mtls_uri_regex:
        uniqueItems: true
        minItems: 1
        items:
          type: string
          description: uri regular expression to skip mtls
        type: array
      depth:
        default: 1
        minimum: 0
        type: integer
    type: object
  sni:
    pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
    type: string
  certs:
    items:
      $ref: ./CertificateOrReference.yaml
    type: array
  keys:
    items:
      $ref: ./PrivateKeyOrReference.yaml
    type: array
  id:
    $ref: ./ResourceId.yaml
  desc:
    maxLength: 256
    type: string
  type:
    enum:
      - server
      - client
    description: ssl certificate type, server to server certificate, client to client certificate for upstream
    default: server
    type: string
  modifiedIndex:
    type: integer
type: object
x-source: apisix/schema_def.lua
