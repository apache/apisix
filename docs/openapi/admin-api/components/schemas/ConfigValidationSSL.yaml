type: object
description: |-
  SSL certificate configuration for TLS termination or mTLS.

  Declarative SSL resource configuration. The optional `modifiedIndex` controls resource-level change detection with the YAML configuration provider.
properties:
  id:
    $ref: ./ResourceId.yaml
  desc:
    type: string
    maxLength: 256
    description: Description.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  type:
    type: string
    default: server
    enum:
      - server
      - client
    description: Certificate type.
    x-enumDescriptions:
      server: HTTPS termination matched by SNI.
      client: Client certificate for mTLS with upstream services.
  sni:
    type: string
    description: Server Name Indication (SNI) to match. Supports wildcard prefix (`*.example.com`). Mutually exclusive with `snis`.
    examples:
      - api.example.com
  snis:
    type: array
    items:
      type: string
    minItems: 1
    description: Multiple SNI hostnames. Mutually exclusive with `sni`.
  cert:
    $ref: ./CertificateOrReference.yaml
    description: PEM-encoded server certificate or an APISIX secret/environment reference.
  key:
    $ref: ./PrivateKeyOrReference.yaml
    description: PEM-encoded private key or an APISIX secret/environment reference. Not returned in GET responses.
  certs:
    type: array
    items:
      $ref: ./CertificateOrReference.yaml
    description: Additional certificates for certificate chain or alternative key types.
  keys:
    type: array
    items:
      $ref: ./PrivateKeyOrReference.yaml
    description: Additional private keys corresponding to `certs`.
  client:
    type: object
    description: mTLS client verification settings.
    required:
      - ca
    properties:
      ca:
        $ref: ./CertificateOrReference.yaml
        description: PEM-encoded CA certificate or an APISIX secret/environment reference for client verification.
      depth:
        type: integer
        minimum: 0
        default: 1
        description: Maximum certificate chain depth.
      skip_mtls_uri_regex:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
        description: URI regex patterns to skip mTLS verification.
  status:
    type: integer
    enum:
      - 1
      - 0
    default: 1
    description: SSL status.
    x-enumDescriptions:
      "0": Disabled.
      "1": Enabled (default).
  ssl_protocols:
    type: array
    items:
      type: string
      enum:
        - TLSv1.1
        - TLSv1.2
        - TLSv1.3
    maxItems: 3
    uniqueItems: true
    description: Allowed TLS protocol versions.
  modifiedIndex:
    type: integer
    description: Optional resource version used for change detection by the YAML configuration provider.
additionalProperties: false
if:
  properties:
    type:
      enum:
        - server
then:
  oneOf:
    - title: Single SNI
      required:
        - sni
        - key
        - cert
    - title: Multiple SNIs
      required:
        - snis
        - key
        - cert
else:
  title: Client certificate
  required:
    - key
    - cert
