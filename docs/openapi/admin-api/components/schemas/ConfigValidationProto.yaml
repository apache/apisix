type: object
description: |-
  Protocol buffer definition for gRPC transcoding.

  Declarative proto configuration. The optional `modifiedIndex` controls resource-level change detection with the YAML configuration provider.
required:
  - content
properties:
  id:
    $ref: ./ResourceId.yaml
  name:
    type: string
    maxLength: 256
    minLength: 1
    description: Human-readable name.
  desc:
    type: string
    maxLength: 256
    description: Description.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  content:
    type: string
    minLength: 1
    maxLength: 1048576
    description: Protobuf `.proto` file content as a string.
  modifiedIndex:
    type: integer
    description: Optional resource version used for change detection by the YAML configuration provider.
additionalProperties: false
