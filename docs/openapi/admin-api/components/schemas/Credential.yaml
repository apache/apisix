type: object
description: Credential configuration for a consumer. A credential can store at most one authentication plugin.
properties:
  id:
    $ref: ./ResourceId.yaml
  name:
    type: string
    maxLength: 256
    minLength: 1
    description: Human-readable name.
  desc:
    type: string
    maxLength: 256
    description: Description of this credential.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  plugins:
    type: object
    maxProperties: 1
    description: At most one authentication plugin configuration (for example, `key-auth`, `basic-auth`, or `jwt-auth`).
additionalProperties: false
