additionalProperties: false
properties:
  update_time:
    type: integer
    readOnly: true
  plugins:
    maxProperties: 1
    type: object
  create_time:
    type: integer
    readOnly: true
  labels:
    $ref: ./Labels.yaml
  id:
    oneOf:
      - $ref: ./ResourceId.yaml
      - minLength: 15
        pattern: ^[a-zA-Z0-9-_]+/credentials/[a-zA-Z0-9-_.]+$
        maxLength: 128
        type: string
  desc:
    maxLength: 256
    type: string
  name:
    minLength: 1
    maxLength: 256
    type: string
  modifiedIndex:
    type: integer
type: object
