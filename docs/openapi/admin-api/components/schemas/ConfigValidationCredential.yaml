type: object
description: |-
  Credential embedded in the declarative `consumers` array. The ID combines the consumer username and credential ID.

  Declarative credential configuration. The optional `modifiedIndex` controls resource-level change detection with the YAML configuration provider.
properties:
  id:
    type: string
    minLength: 15
    maxLength: 128
    pattern: ^[a-zA-Z0-9-_]+/credentials/[a-zA-Z0-9-_.]+$
    description: Credential path in the form `consumer/credentials/credential-id`.
  name:
    type: string
    maxLength: 256
    minLength: 1
    description: Human-readable name.
  desc:
    type: string
    maxLength: 256
    description: Description of this credential.
  labels:
    $ref: ./Labels.yaml
  create_time:
    type: integer
    readOnly: true
    description: Unix timestamp of creation. Read-only.
  update_time:
    type: integer
    readOnly: true
    description: Unix timestamp of last update. Read-only.
  plugins:
    type: object
    maxProperties: 1
    description: Exactly one consumer authentication plugin.
    minProperties: 1
  modifiedIndex:
    type: integer
    description: Optional resource version used for change detection by the YAML configuration provider.
additionalProperties: false
required:
  - id
  - plugins
