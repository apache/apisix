type: object
description: Passive health check configuration. APISIX monitors real traffic responses to determine upstream node health — no extra probes are sent.
properties:
  type:
    type: string
    enum:
      - http
      - https
      - tcp
    default: http
    description: Protocol type for passive health monitoring.
  healthy:
    $ref: ./HealthCheckPassiveHealthy.yaml
  unhealthy:
    $ref: ./HealthCheckPassiveUnhealthy.yaml
