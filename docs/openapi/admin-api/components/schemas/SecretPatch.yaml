description: Partial update for an existing `Secret`. APISIX recursively merges object fields, replaces arrays, and removes an object field when its value is `null`. The merged resource is then validated against the complete `Secret` schema.
anyOf:
  - type: object
    description: HashiCorp Vault secret-manager configuration.
    properties:
      uri:
        type:
          - string
          - "null"
        format: uri
        description: Vault server URI.
      prefix:
        type:
          - string
          - "null"
        description: Path prefix for secrets in Vault.
      token:
        type:
          - string
          - "null"
        description: Vault authentication token or environment-variable URI.
      namespace:
        type:
          - string
          - "null"
        description: Vault Enterprise or HCP Vault namespace.
  - type: object
    description: AWS Secrets Manager configuration.
    properties:
      access_key_id:
        type:
          - string
          - "null"
        description: AWS access key ID or environment-variable URI.
      secret_access_key:
        type:
          - string
          - "null"
        description: AWS secret access key or environment-variable URI.
      session_token:
        type:
          - string
          - "null"
        description: Optional AWS session token or environment-variable URI.
      region:
        type:
          - string
          - "null"
        default: us-east-1
        description: AWS region.
      endpoint_url:
        type:
          - string
          - "null"
        format: uri
        description: Custom AWS Secrets Manager endpoint.
  - type: object
    description: Google Cloud Secret Manager configuration.
    properties:
      auth_config:
        type:
          - object
          - "null"
        properties:
          client_email:
            type:
              - string
              - "null"
          private_key:
            type:
              - string
              - "null"
          project_id:
            type:
              - string
              - "null"
          token_uri:
            type:
              - string
              - "null"
            default: https://oauth2.googleapis.com/token
          scope:
            type:
              - array
              - "null"
            items:
              type: string
            default:
              - https://www.googleapis.com/auth/cloud-platform
          entries_uri:
            type:
              - string
              - "null"
            default: https://secretmanager.googleapis.com/v1
      ssl_verify:
        type:
          - boolean
          - "null"
        default: true
      auth_file:
        type:
          - string
          - "null"
        description: Path to a Google service-account JSON file.
