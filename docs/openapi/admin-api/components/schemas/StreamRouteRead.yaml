additionalProperties: false
not:
  required:
    - sni
    - snis
properties:
  remote_addr:
    anyOf:
      - title: IPv4
        format: ipv4
        type: string
      - title: IPv4/CIDR
        pattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([12]?[0-9]|3[0-2])$
        type: string
      - title: IPv6
        format: ipv6
        type: string
      - title: IPv6/CIDR
        pattern: ^([a-fA-F0-9]{0,4}:){1,8}(:[a-fA-F0-9]{0,4}){0,8}([a-fA-F0-9]{0,4})?/[0-9]{1,3}$
        type: string
    type: string
    description: client IP
  sni:
    pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
    type: string
    description: server name indication
  upstream_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  create_time:
    type: integer
    readOnly: true
  service_id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  plugins:
    type: object
  id:
    anyOf:
      - pattern: ^[a-zA-Z0-9-_.]+$
        maxLength: 64
        minLength: 1
        type: string
      - minimum: 1
        type: integer
  server_addr:
    anyOf:
      - title: IPv4
        format: ipv4
        type: string
      - title: IPv4/CIDR
        pattern: ^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/([12]?[0-9]|3[0-2])$
        type: string
      - title: IPv6
        format: ipv6
        type: string
      - title: IPv6/CIDR
        pattern: ^([a-fA-F0-9]{0,4}:){1,8}(:[a-fA-F0-9]{0,4}){0,8}([a-fA-F0-9]{0,4})?/[0-9]{1,3}$
        type: string
    type: string
    description: server IP
  server_port:
    minimum: 1
    maximum: 65535
    type: integer
    description: server port
  labels:
    patternProperties:
      .*:
        maxLength: 256
        description: value of label
        minLength: 1
        pattern: ^\S+$
        type: string
    type: object
    description: key/value pairs to specify attributes
  desc:
    maxLength: 256
    type: string
  protocol:
    required:
      - name
    properties:
      name:
        type: string
      conf:
        type: object
        description: protocol-specific configuration
      superior_id:
        anyOf:
          - pattern: ^[a-zA-Z0-9-_.]+$
            maxLength: 64
            minLength: 1
            type: string
          - minimum: 1
            type: integer
      logger:
        items:
          additionalProperties: false
          properties:
            name:
              type: string
            filter:
              type: array
              description: logger filter rules
            conf:
              type: object
              description: logger plugin configuration
          dependentRequired:
            name:
              - conf
        type: array
    type: object
  name:
    minLength: 1
    maxLength: 256
    type: string
  snis:
    description: server name indications, matched as alternatives
    uniqueItems: true
    minItems: 1
    items:
      pattern: ^\*$|^\*?[0-9a-zA-Z-._\[\]:]+$
      type: string
    type: array
  tls_passthrough:
    default: false
    type: boolean
    description: forward the TLS stream to the upstream untouched instead of terminating it here; only consulted on a mixed listen, one with both tls and tls_passthrough set
  upstream:
    $ref: ./UpstreamRead.yaml
  update_time:
    type: integer
    readOnly: true
type: object
x-source: apisix/schema_def.lua
description: Stored StreamRoute configuration returned by the Admin API.
