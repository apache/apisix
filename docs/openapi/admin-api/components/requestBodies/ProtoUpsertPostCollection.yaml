description: "`Proto` configuration body for create / replace / patch."
required: true
content:
  application/json:
    schema:
      allOf:
        - $ref: ../schemas/Proto.yaml
        - not:
            anyOf:
              - required:
                  - create_time
              - required:
                  - update_time
              - required:
                  - id
      description: Wire request body. APISIX injects timestamps and, where appropriate, the path or generated resource ID. A supplied ID must agree with the path.
    example:
      content: |-
        syntax = "proto3";

        package helloworld;

        service Greeter {
          rpc SayHello (HelloRequest) returns (HelloReply) {}
        }

        message HelloRequest {
          string name = 1;
        }

        message HelloReply {
          string message = 1;
        }
