description: "`Consumer` configuration body for create / replace / patch."
required: true
content:
  application/json:
    schema:
      allOf:
        - $ref: ../schemas/Consumer.yaml
        - not:
            anyOf:
              - required:
                  - create_time
              - required:
                  - update_time
      description: Wire request body. APISIX injects timestamps and, where appropriate, the path or generated resource ID. A supplied ID must agree with the path.
    example:
      username: my-app
      desc: Mobile application consumer
      labels:
        team: mobile
        env: production
      plugins:
        key-auth:
          key: app-secret-key-123
