description: Complete secret-manager configuration for the manager selected by `secret_type`.
required: true
content:
  application/json:
    schema:
      allOf:
        - $ref: ../schemas/Secret.yaml
        - not:
            anyOf:
              - required:
                  - create_time
              - required:
                  - update_time
      description: Wire request body. APISIX injects timestamps and, where appropriate, the path or generated resource ID. A supplied ID must agree with the path.
    examples:
      vault:
        summary: HashiCorp Vault
        value:
          uri: https://vault.example.com
          prefix: apisix
          token: $ENV://VAULT_TOKEN
          namespace: team-a
      aws:
        summary: AWS Secrets Manager
        value:
          access_key_id: $ENV://AWS_ACCESS_KEY_ID
          secret_access_key: $ENV://AWS_SECRET_ACCESS_KEY
          region: us-east-1
      gcp:
        summary: Google Cloud Secret Manager
        value:
          auth_file: /etc/apisix/gcp-service-account.json
          ssl_verify: true
