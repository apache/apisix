description: Fields to merge into the existing `Upstream`. Object fields are merged recursively; arrays are replaced.
required: true
content:
  application/json:
    schema:
      $ref: ../schemas/UpstreamPatch.yaml
    examples:
      updateDescription:
        summary: Update the upstream description
        value:
          desc: Updated upstream description
      addNode:
        summary: Add an upstream node
        value:
          nodes:
            127.0.0.1:1981: 1
