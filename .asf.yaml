github:
  description: The Cloud-Native API Gateway and AI Gateway
  homepage: https://apisix.apache.org/blog/
  labels:
    - api-gateway
    - ai-gateway
    - cloud-native
    - kubernetes-ingress
    - nginx
    - luajit
    - microservices
    - api
    - loadbalancing
    - reverse-proxy
    - api-management
    - apisix
    - serverless
    - iot
    - devops
    - kubernetes
    - openapi
    - openapi3
    - openapi31
  
  enabled_merge_buttons:
    squash:  true
    # **WARNING**: rebase should only be used
    # when backport multiple commits to the `release/xx` branch
    rebase:  true
    merge:   false
  
  rulesets:
    - name: APISIX branch protection
      type: branch
      branches:
        includes:
          - master
          - release/*
        excludes: []
      restrict_deletion: true
      restrict_force_push: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 3

notifications:
  commits:      notifications@apisix.apache.org
  issues:       notifications@apisix.apache.org
  pullrequests: notifications@apisix.apache.org
